<script id="wa-objekt-mobile-performance-v2-js">
(()=>{'use strict';
  /* One passive listener: skip per-card image fades while virtual list is moving. */
  let idle=0;
  document.addEventListener('scroll',e=>{
    if(!e.target?.matches?.('.oc8-scroll'))return;
    const root=document.documentElement;
    if(!root.classList.contains('wa-oc-fast-scroll'))root.classList.add('wa-oc-fast-scroll');
    clearTimeout(idle);
    idle=setTimeout(()=>root.classList.remove('wa-oc-fast-scroll'),140);
  },{capture:true,passive:true});
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clearTimeout(idle);document.documentElement.classList.remove('wa-oc-fast-scroll');}
  },{passive:true});
})();
</script>
