<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0f"><title>WAV ARCHIVE · Offline</title><style>:root{--glass-bg:rgba(35,20,49,.82);--neon-purple:#af8af8;--text-primary:#f4efff}body{margin:0;padding:25px;color:var(--text-primary);background:#0b0b0f;font:16px/1.6 system-ui}main{max-width:680px;margin:auto}section{padding:22px;border:1px solid #62487f;border-radius:22px;background:var(--glass-bg)}a{color:var(--neon-purple)}h1{font-size:1.8rem}p{overflow-wrap:anywhere}</style></head><body><main><h1>WAV ARCHIVE / OFFLINE</h1><section><h2>오프라인 핵심 안내</h2><p>연결이 없어도 캐시된 멤버 디렉터리와 WAV LABS 기능 중 이전에 저장된 내용을 확인할 수 있습니다.</p><p><a href="./">WAV LABS 열기</a> · <a href="../">홈으로 이동</a></p><div id="essential">정보팩 불러오는 중…</div></section></main><script type="module">try{const [members,guide]=await Promise.all([fetch('./essentials/members-mini.json').then(r=>r.json()),fetch('./essentials/cheering-guide.ko.json').then(r=>r.json())]);document.querySelector('#essential').replaceChildren();const p=document.createElement('p');p.textContent=`멤버 디렉터리: ${members.length}명 · ${guide.title}`;document.querySelector('#essential').append(p);const a=document.createElement('a');a.href=guide.officialVideo;a.textContent='응원법 공식 영상 링크 (온라인 필요)';document.querySelector('#essential').append(a);}catch{document.querySelector('#essential').textContent='저장된 정보팩을 확인할 수 없습니다.'}</script></body></html>
