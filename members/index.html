<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090910">
<title>MEMBERS · WAV ARCHIVE</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090910;color:#f3effd;font:15px/1.7 system-ui,-apple-system,"Noto Sans KR",sans-serif}
#wa63Loader{min-height:50vh;display:grid;place-content:center;text-align:center;padding:24px}
.wa63w-k{font-size:11px;letter-spacing:.2em;font-weight:750;color:#c7a3fa}.wa63w-t{font-size:clamp(27px,7vw,42px);font-weight:800;margin:10px 0}.wa63w-desc{color:#bfb3cc;max-width:460px}
.wa63w-button{border:1px solid #76529d;border-radius:13px;background:#2c1e42;color:#f5eeff;padding:12px 18px;display:inline-block;text-decoration:none;margin:8px}
#wa63Loader[data-error] .wa63w-loading{display:none}#wa63Loader .wa63w-error{display:none}#wa63Loader[data-error] .wa63w-error{display:block}
</style>
</head>
<body>
<div id="wa63Loader" role="status" aria-live="polite">
 <div><div class="wa63w-k">WAV ARCHIVE · ORIGINAL SYSTEM</div><div class="wa63w-t">MEMBERS</div>
 <p class="wa63w-desc wa63w-loading">기존 기능과 데이터를 그대로 불러오는 중…</p>
 <div class="wa63w-error"><p class="wa63w-desc">기존 아카이브 원본을 불러오지 못했어요. 인터넷 연결이나 캐시를 확인한 뒤 다시 시도해 주세요.</p><a class="wa63w-button" href="../#members">기존 아카이브에서 열기 ↗</a><button class="wa63w-button" type="button" id="wa63Retry">다시 시도</button></div>
 </div>
</div>
<script>
/* 6.3 FULL FIDELITY: Load same-origin current index intact, inject display-only CSS.
   NO member/dimension markup cloned, data copied, or original engine overwritten. */
(async () => {
  const loader=document.getElementById('wa63Loader');
  const filename = new URL('../index.html', location.href);
  const viewCSS = "\n/* WAV ARCHIVE 6.3 full-fidelity viewer: no original functionality removed. */\nhtml.wa-fullpage-63 body{overflow-x:hidden!important}\nhtml.wa-fullpage-63 main#top {min-height:0!important;padding-top:18px!important;padding-bottom:calc(128px + env(safe-area-inset-bottom,0px))!important}\nhtml.wa-fullpage-63 main#top > :not(:is(#members)) {display:none!important}\nhtml.wa-fullpage-63 :is(#members) {display:block!important;visibility:visible!important;opacity:1!important;content-visibility:visible!important;transform:none!important}\nhtml.wa-fullpage-63 :is(#members) .section-head{margin-top:0}\nhtml.wa-fullpage-63 :is(#members) .reveal{opacity:1!important;visibility:visible!important}\nhtml.wa-fullpage-63 body > :is(#wa60Command,#waHome45,#waXMyUniverse,#wavId,#waMemories,#waSpecialRecord,.creator-strip){display:none!important}\n/* Decorative floating notices are suppressed, but UI dialogs and controls are retained. */\nhtml.wa-fullpage-63 #v70LatestUpdates,html.wa-fullpage-63 .wa-notice-entry,html.wa-fullpage-63 #wa52UpdateStatus{display:none!important}\nhtml.wa-fullpage-63 .wa-major-dock,html.wa-fullpage-63 #waMajorDock{bottom:env(safe-area-inset-bottom,0px)}\n@media(max-width:500px){html.wa-fullpage-63 main#top{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))!important}}\n";
  async function boot(){
    delete loader.dataset.error;
    try {
      let response;
      try { response = await fetch(filename, { cache:'no-cache', credentials:'same-origin' }); }
      catch (_) { response = await fetch(filename, { cache:'force-cache', credentials:'same-origin' }); }
      if(!response.ok) throw new Error('Homepage source unavailable: ' + response.status);
      let source = await response.text();
      if(!/<main\b[^>]*\bid=["']top["']/.test(source)) throw new Error('Unexpected homepage structure');
      if(!source.includes('id="members"')) throw new Error('Original section missing');
      const originalTitle = document.title;
      source = source.replace(/<html\b([^>]*)>/i, (full, attrs) => {
         return '<html' + attrs.replace(/\sclass=["'][^"']*["']/i, '') + ' class="wa-fullpage-63">';
      });
      // The <base> preserves every relative asset URL, although the page URL is /members/ or /dimensions/.
      source = source.replace(/<head([^>]*)>/i, (full) => full + '\n<base href="../">\n<style id="wa63-fullpage-focus">'+viewCSS+'</style>\n');
      // Add a small transparent runtime flag for diagnostics; full original JS/CSS still run unmodified.
      source = source.replace(/<\/body>/i, '<style id="wa63-fullpage-priority">'+viewCSS+'</style>' + '<scr'+'ipt>window.WAV_ARCHIVE_FULL_SECTION="members";</scr'+'ipt></body>');
      document.open();
      document.write(source);
      document.close();
      // Source title is intentionally retained for continuity with the original code.
      document.title = originalTitle;
    } catch(error) {
      console.error('[WAV Full Page]',error);
      loader.dataset.error='true';
      const retry=document.getElementById('wa63Retry');
      if(retry) retry.onclick=boot;
    }
  }
  await boot();
})();
</script>
</body>
</html>
