<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:radial-gradient(ellipse 70% 40% at 90% 0%,#22204f 0%,transparent 70%),var(--bg);margin:0;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}a{color:inherit}button{font:inherit}a,button{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}.wrap{width:min(980px,calc(100% - 32px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:24px 0}.brand{font-weight:800;letter-spacing:.15em;text-decoration:none;font-size:13px}.back{font-size:12px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px}.hero{padding:36px 0 34px}.kicker{color:var(--aqua);font:700 11px/1.3 ui-monospace,monospace;letter-spacing:.22em}.hero h1{font-size:clamp(31px,6.7vw,64px);letter-spacing:-.055em;line-height:1.1;margin:12px 0}.hero strong{color:var(--violet)}.intro{color:var(--muted);max-width:700px;font-size:14px}.langs{display:flex;gap:6px;margin-top:25px}.langs button{background:#141628;border:1px solid var(--line);border-radius:9px;color:var(--muted);padding:7px 13px;cursor:pointer}.langs button[aria-pressed=true]{background:rgba(162,145,255,.18);color:var(--ink);border-color:var(--violet)}section{padding:12px 0 28px}section h2{font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin:0 0 14px}section h2::before{content:"";display:block;width:3px;height:19px;border-radius:8px;background:linear-gradient(var(--violet),var(--aqua))}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:15px;background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.012));padding:19px;min-width:0}.card small{display:block;color:var(--aqua);font:700 10px/1.5 ui-monospace,monospace;letter-spacing:.1em}.card h3{font-size:16px;margin:8px 0 5px;line-height:1.45}.card p{font-size:12px;color:var(--muted);margin:0 0 13px}.source{display:inline-flex;align-items:center;gap:5px;color:var(--violet);font-size:12px;text-decoration:none}.source:hover{text-decoration:underline}.rows{display:grid;gap:7px}.row{border:1px solid var(--line);border-radius:12px;padding:12px 15px;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.025)}.row .date{font:700 12px ui-monospace,monospace;color:var(--aqua);flex:0 0 96px}.row .info{flex:1;min-width:0}.row .info b{display:block;font-size:13px}.row .info span{display:block;color:var(--muted);font-size:12px}.row .source{white-space:nowrap}.smallnotice{font-size:12px;color:var(--muted);border-left:2px solid var(--violet);padding-left:12px;margin:18px 0 10px}.foot{border-top:1px solid var(--line);padding:24px 0 36px;font-size:11px;color:var(--muted)}.foot a{color:var(--violet)}

<body><div class="wrap"><header class="top"><a class="brand" href="../../index.html">WAV ARCHIVE</a><a class="back" id="home" href="../../index.html">← HOME</a></header><main><div class="hero"><div class="kicker">OFFICIAL CONTENT DIGEST · 2026.11</div><h1>NOVEMBER<br><strong>UPDATE</strong></h1><p class="intro" id="intro">공식 발표를 바탕으로 정리한 11월 소식 · 데이터 출처는 각 카드에 표시합니다</p><div class="langs" aria-label="Language"><button type="button" data-lang="ko" aria-pressed="true">KO</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="ja" aria-pressed="false">JA</button></div></div><section><h2 id="headlinesTitle">음반 · 영상 · 예정 소식</h2><div id="headlines" class="grid" aria-live="polite"></div></section><section><h2 id="liveTitle">이번 주 라이브</h2><div id="streams" class="grid"></div></section><section><h2 id="tourTitle">ANDLESS 북미 투어</h2><div id="tour" class="rows"></div></section><section><h2 id="extraTitle">이벤트 응모 마감</h2><div id="extras" class="grid"></div></section><p class="smallnotice" id="notice"></p></main><footer class="foot">CREATED BY @bbangshion · <span id="verified"></span><br><a href="../../index.html#updates">WAV ARCHIVE ↗</a>　 ·　<a href="../../index.html#discography">DISCOGRAPHY ↗</a>　 ·　<a href="../../index.html#timeline">HISTORY ↗</a></footer></div>
<script>
(()=>{'use strict';const txt={ko:['공식 발표를 바탕으로 정리한 11월 소식 · 각 카드에서 원문 출처를 확인할 수 있어요','음반 · 영상 · 예정 소식','이번 주 라이브','ANDLESS 북미 투어','이벤트 응모 마감','공식 자료 ↗','마지막 자료 확인'],en:['November updates based on official announcements · open each item for the original source','Releases · Videos · Announcements','This week’s live events','ANDLESS North American tour','Campaign deadlines','Official source ↗','Sources checked'],ja:['公式発表に基づく11月の記録・各項目から一次情報を確認できます','リリース・映像・今後の予定','今週のライブ','ANDLESS 北米ツアー','キャンペーン締切','公式情報 ↗','最終確認']};let lang=localStorage.getItem('wa-site-lang');if(!['ko','en','ja'].includes(lang))lang='ko';let data;const pick=o=>(o&&typeof o==='object'?(o[lang]||o.ko||o.en):o)||'';function el(tag,cls,content){const x=document.createElement(tag);if(cls)x.className=cls;if(content!==undefined)x.textContent=String(content);return x;}function link(url){if(!/^https:\/\//.test(url||''))return null;const a=el('a','source',txt[lang][5]);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}function cards(id,list){const root=document.getElementById(id);root.replaceChildren();for(const item of list){const card=el('article','card');card.append(el('small','',item.date+' · '+(item.kind||item.sourceLabel||'OFFICIAL')));card.append(el('h3','',pick(item.title)));card.append(el('p','',pick(item.detail)));const a=link(item.sourceUrl);if(a)card.append(a);root.append(card)}}function tour(){const root=document.getElementById('tour');root.replaceChildren();for(const item of data.tour){const row=el('div','row');row.append(el('div','date',item.date));const inf=el('div','info');inf.append(el('b','',item.city));inf.append(el('span','',item.venue));row.append(inf);const a=link(item.sourceUrl);if(a)row.append(a);root.append(row)}}function draw(){document.documentElement.lang=lang;document.getElementById('intro').textContent=txt[lang][0];['headlinesTitle','liveTitle','tourTitle','extraTitle'].forEach((id,i)=>document.getElementById(id).textContent=txt[lang][i+1]);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.getElementById('notice').textContent=pick(data.notice);document.getElementById('verified').textContent=txt[lang][6]+': '+data.verifiedThrough;cards('headlines',data.headlines);cards('streams',data.streams);cards('extras',data.extras);tour()}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('wa-site-lang',lang)}catch(_){}draw()}));fetch('../../data/wav-november-content-2026.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;draw()}).catch(()=>{document.getElementById('intro').textContent='콘텐츠 자료를 불러오지 못했어요. 잠시 후 새로고침해 주세요.'})})();
</script>
