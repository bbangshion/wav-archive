                  if target.is_file():
                      if target.read_bytes() == data:
                          same.append(name)
                          continue
                      if not force:
                          preserved.append(name)
                          print('PRESERVED EXISTING (not overwritten):', name)
                          continue
                      updated.append(name)
                  else:
                      added.append(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  print('INSTALLED:', name)
          # Minimal bridge hook: keeps existing 2-column layout, flip logic, Gravity and Badge War code intact.
          bridge_path = root / 'wav-member-view-360-3-2.js'
          anchor = "const summary=mk('div','wa22-hero-copy');summary.append(mk('small','wa22-hero-kicker',t.name),mk('strong','',data.id+' · '+data.name),mk('span','',data.en||'tripleS'));row.append(summary);"
          replacement = """const summary=mk('div','wa22-hero-copy');summary.append(mk('small','wa22-hero-kicker',t.name),mk('strong','',data.id+' · '+data.name),mk('span','',data.en||'tripleS'));
              const universeLabel=({ko:'멤버 독립 아카이브 ↗',en:'Open member archive ↗',ja:'メンバー専用アーカイブ ↗'})[locale()];
              const universeLink=link(universeLabel,new URL('./members/'+data.id.toLowerCase()+'/',document.baseURI).href,'wa22-button wa-member-universe-link');
              universeLink.setAttribute('aria-label',data.name+' · '+universeLabel);summary.append(universeLink);row.append(summary);"""
          if bridge_path.exists():
              original = bridge_path.read_text(encoding='utf-8')
              if 'wa-member-universe-link' in original:
                  print('BRIDGE: already linked; unchanged')
              elif original.count(anchor) == 1:
                  bridge_path.write_text(original.replace(anchor,replacement),encoding='utf-8')
                  print('BRIDGE: inserted only the independent-page link')
              else:
                  print('WARNING: Bridge code differs; not modified to avoid losing newer features')
          else:
              print('WARNING: Member 360 JS was not found; no bridge was modified')
          print(f'PAGES/ASSETS: added={len(added)}, identical={len(same)}, overwritten_on_request={len(updated)}, existing_preserved={len(preserved)}')
          if preserved:
              print('Existing conflicting files were intentionally preserved; run again with overwrite_pages=true only if you want to replace these member pages/assets.')
          assert all((root / f'members/s{i:02d}/index.html').is_file() for i in range(1,25)), 'Missing member pages'
          assert all((root / f'members/universe/{s}').is_file() for s in ('member-universe.js','member-universe.css','members.json')), 'Missing common assets'
          PYMEMBER
