name: WAV ARCHIVE · Badge War integrity
on:
  push:
    paths:
      - 'index.html'
      - 'wa-badge-war-hub.js'
      - 'wa-badge-war-hub.css'
      - 'wav-member-view-360-3-2.js'
      - 'data/wa-badgewar-seasons.json'
      - 'data/wa-badgewar-phase2.json'
      - 'data/wa-badgewar-phase4.json'
      - 'tests/wa_badgewar_check.py'
      - '.github/workflows/wa-badgewar-integrity.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'wa-badge-war-hub.js'
      - 'wa-badge-war-hub.css'
      - 'wav-member-view-360-3-2.js'
      - 'data/wa-badgewar-seasons.json'
      - 'data/wa-badgewar-phase2.json'
      - 'data/wa-badgewar-phase4.json'
      - 'tests/wa_badgewar_check.py'
      - '.github/workflows/wa-badgewar-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify full Badge War baseline and sourced Gravity/member connections
        run: python tests/wa_badgewar_check.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check archive and member-detail engines
        run: |
          node --check wa-badge-war-hub.js
          node --check wav-member-view-360-3-2.js
