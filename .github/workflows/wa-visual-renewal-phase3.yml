name: WAV ARCHIVE - Visual Renewal Phase 3

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Apply, verify or rollback MEMBER / MEMBER UNIVERSE Phase 3 CSS'
        type: choice
        required: true
        default: apply
        options:
          - apply
          - verify
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-visual-renewal-p3
  cancel-in-progress: false

jobs:
  member-visual-renewal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main (no historical HTML replacement)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Refuse non-main run
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main" || { echo 'SAFETY STOP: run on main'; exit 2; }
      - name: Safe CSS-only apply / verify / rollback
        shell: bash
        env:
          WA_VISUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - "$WA_VISUAL_MODE" <<'PY'
          #!/usr/bin/env python3
          """WAV ARCHIVE Visual Renewal P3 — limited, reversible CSS-only install.
          
          Operates solely on the checkout's latest index.html + member-universe.css,
          without copying historical pages, altering JavaScript, images or DOM components.
          """
          from __future__ import annotations
          
          import base64
          import hashlib
          import re
          import sys
          from pathlib import Path
          
          ROOT = Path.cwd()
          INDEX = ROOT / "index.html"
          UNIVERSE = ROOT / "members/universe/member-universe.css"
          MAIN_STYLESHEET = ROOT / "wa-visual/v3-member.css"
          MAIN_CSS = base64.b64decode("")
          UNIVERSE_CSS = base64.b64decode("")
          
          HTML_BEGIN = "<!-- WA-VISUAL-RENEWAL-P3:BEGIN -->"
          HTML_END = "<!-- WA-VISUAL-RENEWAL-P3:END -->"
          HTML_BLOCK = (
              HTML_BEGIN + "\n"
              '<link id="wa-visual-renewal-p3" rel="stylesheet" '
              'href="./wa-visual/v3-member.css?v=20261107-p3">\n'
              + HTML_END + "\n"
          )
          MEMBER_BEGIN = "/* WA-VISUAL-RENEWAL-P3-MEMBER:BEGIN */"
          MEMBER_END = "/* WA-VISUAL-RENEWAL-P3-MEMBER:END */"
          MEMBER_BLOCK = (
              "\n" + MEMBER_BEGIN + "\n" + UNIVERSE_CSS.decode("utf-8").rstrip()
              + "\n" + MEMBER_END + "\n"
          )
          
          
          def stop(message: str) -> None:
              raise RuntimeError("SAFETY STOP: " + message)
          
          
          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8")
          
          
          def write(path: Path, content: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8", newline="")
          
          
          def validate_source(html: str, member_css: str) -> None:
              if "WAV ARCHIVE" not in html:
                  stop("WAV ARCHIVE signature absent from index.html")
              if not re.search(r"id\s*=\s*['\"]memberGrid['\"]", html):
                  stop("existing memberGrid missing (not risking the member card layout)")
              if not re.search(r"id\s*=\s*['\"]members['\"]", html):
                  stop("existing #members section missing")
              if "member-card" not in html or "member-card-inner" not in html:
                  stop("existing member card/flip markup missing")
              if html.lower().count("</head>") != 1:
                  stop("index.html head structure changed")
              if not re.search(r"\.hero\s*\{|\.hero\s*,", member_css):
                  stop("independent-member stylesheet structure unexpected")
              if not (ROOT / "members/s01/index.html").is_file() or not (
                  ROOT / "members/s24/index.html"
              ).is_file():
                  stop("S01 and S24 independent pages are required before styling")
          
              if html.count(HTML_BEGIN) != html.count(HTML_END) or html.count(HTML_BEGIN) > 1:
                  stop("Phase 3 main markers are inconsistent")
              if HTML_BEGIN in html and HTML_BLOCK not in html:
                  stop("Phase 3 link has been manually altered; preserve user changes")
              if HTML_BEGIN not in html and (
                  'id="wa-visual-renewal-p3"' in html or "wa-visual/v3-member.css" in html
              ):
                  stop("Phase 3 main link exists without controlled markers")
              if member_css.count(MEMBER_BEGIN) != member_css.count(MEMBER_END) or (
                  member_css.count(MEMBER_BEGIN) > 1
              ):
                  stop("Phase 3 universe markers are inconsistent")
              if MEMBER_BEGIN in member_css and MEMBER_BLOCK not in member_css:
                  stop("Phase 3 universe CSS has been manually altered; not overwriting")
              if MAIN_STYLESHEET.exists() and MAIN_STYLESHEET.read_bytes() != MAIN_CSS:
                  stop("Phase 3 main CSS has user edits; not overwriting/deleting")
          
          
          def inspect() -> tuple[str, str, bool, bool, bool]:
              if not INDEX.is_file() or not UNIVERSE.is_file():
                  stop("index.html or members/universe/member-universe.css missing")
              html = read(INDEX)
              member_css = read(UNIVERSE)
              validate_source(html, member_css)
              return (html, member_css, HTML_BEGIN in html,
                      MEMBER_BEGIN in member_css, MAIN_STYLESHEET.exists())
          
          
          def apply() -> None:
              html, member_css, linked, appended, css_present = inspect()
              if (linked, appended, css_present) not in ((False, False, False), (True, True, True)):
                  stop("partial Phase 3 install detected; no partial modifications attempted")
              if linked:
                  print("VISUAL P3: ALREADY INSTALLED | untouched")
                  return
              # All read-only validation finishes before touching any site file.
              # Append only, preserving all previously installed Phase 1 / 2 / member modules.
              write(INDEX, html.replace("</head>", HTML_BLOCK + "</head>", 1))
              write(UNIVERSE, member_css + MEMBER_BLOCK)
              MAIN_STYLESHEET.parent.mkdir(parents=True, exist_ok=True)
              MAIN_STYLESHEET.write_bytes(MAIN_CSS)
              print("VISUAL P3: APPLIED | member gallery + 24 MEMBER UNIVERSE pages")
              print("CSS-only. Existing two-column grid, 3D flip, MEMBER 360 and member content preserved.")
          
          
          def verify() -> None:
              _, _, linked, appended, css_present = inspect()
              if not all((linked, appended, css_present)):
                  stop("Phase 3 is not fully installed")
              print("VISUAL P3: VERIFIED")
              print("main css sha256=" + hashlib.sha256(MAIN_CSS).hexdigest()[:16])
              print("universe css sha256=" + hashlib.sha256(UNIVERSE_CSS).hexdigest()[:16])
              print("Static checks only; test member flip and mobile layout on live deployment")
          
          
          def rollback() -> None:
              html, member_css, linked, appended, css_present = inspect()
              if (linked, appended, css_present) not in ((False, False, False), (True, True, True)):
                  stop("partial Phase 3 installation; safe automatic rollback refused")
              if not linked:
                  print("VISUAL P3: ALREADY ROLLED BACK | untouched")
                  return
              write(INDEX, html.replace(HTML_BLOCK, "", 1))
              write(UNIVERSE, member_css.replace(MEMBER_BLOCK, "", 1))
              MAIN_STYLESHEET.unlink()
              if not any(MAIN_STYLESHEET.parent.iterdir()):
                  MAIN_STYLESHEET.parent.rmdir()
              print("VISUAL P3: ROLLED BACK | Phase 1, Phase 2 and member modules retained")
          
          
          if __name__ == "__main__":
              try:
                  {"apply": apply, "verify": verify, "rollback": rollback}[sys.argv[1]]()
              except (OSError, KeyError, IndexError, RuntimeError) as exc:
                  print(str(exc), file=sys.stderr)
                  sys.exit(2)
          PY
      - name: Enforce CSS-only allowed paths and commit
        if: inputs.mode != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from subprocess import run
          out=run(['git','status','--porcelain','--untracked-files=all'],check=True,text=True,capture_output=True).stdout
          changed={line[3:] for line in out.splitlines() if len(line) > 3}
          allowed={'index.html','members/universe/member-universe.css','wa-visual/v3-member.css'}
          if changed-allowed:
              raise SystemExit('SAFETY STOP: unexpected changed files: '+str(sorted(changed-allowed)))
          print('VISUAL P3: approved changed paths', sorted(changed))
          PY
          git add -A -- index.html members/universe/member-universe.css wa-visual/v3-member.css
          if git diff --cached --quiet; then
            echo 'VISUAL P3: no new changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: premium member and member universe renewal phase 3'
          git push origin HEAD:main
      - name: Result summary
        if: always()
        shell: bash
        run: |
          echo '## WAV ARCHIVE — Visual Renewal Phase 3' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode: **${{ inputs.mode }}**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Only main index stylesheet link, P3 CSS file, and independent-member shared CSS are affected' >> "$GITHUB_STEP_SUMMARY"
          echo '- No member card DOM/3D logic, member universe modules, data, service workers or 24 pages replaced' >> "$GITHUB_STEP_SUMMARY"
          echo '- Test S20 page, 2-column card layout, card flip, DETAIL, 360 and mobile interactions after deployment' >> "$GITHUB_STEP_SUMMARY"
