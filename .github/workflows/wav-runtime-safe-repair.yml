          assert hashlib.sha256(src).hexdigest()=='1b15e5c33744e1537014c7489c54119ed5cbb78bb2c786ff6ae3ccab1df83c5f', 'bad embedded script integrity'
          (p/'wav_runtime_repair.py').write_bytes(src)
          PYRESTORE
