name: WAV ARCHIVE - Runtime Performance Safe Repair

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit first; apply compatible source only; rollback only this patch'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-archive-runtime-safe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safe-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout existing website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

