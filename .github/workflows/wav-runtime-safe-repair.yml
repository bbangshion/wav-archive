      - name: Audit compatibility, apply safe changes or roll back
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav_runtime_repair.py" --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"

      - name: Stage and commit only verified runtime patches
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ -f objekt-collection/app.mjs ]; then git add -- objekt-collection/app.mjs; fi
          if [ -f signal-moments/signal.js ]; then git add -- signal-moments/signal.js; fi
          if [ -f .wav-performance/phase4.json ] || git ls-files --error-unmatch .wav-performance/phase4.json >/dev/null 2>&1; then
            git add -A -- .wav-performance/phase4.json
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No compatible changes found: nothing committed. See step Summary for exact reasons.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "perf: $WA_OPERATION verified Objekt and SIGNAL optimization"
          git push origin "HEAD:$GITHUB_REF_NAME"
