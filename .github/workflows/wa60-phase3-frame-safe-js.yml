          python3 -m py_compile /tmp/wa60_phase3_patch.py

      - name: Optimize the two known hot event handlers (or audit only)
        id: patch
        shell: bash
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 /tmp/wa60_phase3_patch.py \
            --index index.html \
            --mode "$MODE" \
            --out-dir wa60-phase3-results

      - name: Show result and regression scope
        if: always()
        shell: bash
        run: |
          if [ -f wa60-phase3-results/WAV_ARCHIVE_6_0_PHASE3_REPORT.md ]; then
            cat wa60-phase3-results/WAV_ARCHIVE_6_0_PHASE3_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Phase 3 failed before creating a report. No site commit will be made." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '#### Changed tracked paths before commit' >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit and patch report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WAV_ARCHIVE_6_0_PHASE3_REPORT_${{ github.run_number }}
          path: wa60-phase3-results/
          if-no-files-found: warn

      - name: Commit and push only index.html
        if: steps.patch.outcome == 'success' && inputs.mode != 'audit'
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only -- . ':!index.html')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected modified tracked files: $unexpected"
            exit 1
          fi
          if git diff --quiet -- index.html; then
            echo 'No index.html diff: patch was already in desired state.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html
          git commit -m "perf: frame-safe member glare and scroll indicator (${{ inputs.mode }})"
          git push origin HEAD:main
          echo 'Committed current-branch index.html only; GitHub Pages will redeploy.' >> "$GITHUB_STEP_SUMMARY"

      - name: Halt if patch guard rejected unknown code
        if: steps.patch.outcome != 'success'
        shell: bash
        run: |
          echo 'The current source differs from expected code; STOPPED without committing. Download the report artifact.'
          exit 1
