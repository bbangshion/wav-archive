      mode:
        description: "apply = optimize / audit = report only / rollback = undo only phase 3"
        required: true
        type: choice
        default: apply
        options:
          - apply
          - audit
          - rollback

permissions:
  contents: write

concurrency:
  group: wa60-phase3-${{ github.ref }}
