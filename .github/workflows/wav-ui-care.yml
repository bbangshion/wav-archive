        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64,hashlib,gzip,io,os,pathlib,tarfile
          raw=base64.b64decode(os.environ['WA_UI_PAYLOAD'])
          if hashlib.sha256(raw).hexdigest()!='df49d512a4a4cc917bd904bf7263227056bce00cf079ee596910c54617ba5a69':
              raise SystemExit('Installer checksum mismatch; no repo changes')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'wav-ui-care'
          target.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode='r:') as z:
              members=z.getmembers()
              allowed={'apply_patch.py','ui.css','ui.js'}
              if {m.name for m in members}!=allowed or any(not m.isfile() for m in members):
                  raise SystemExit('Unexpected archive structure')
              for m in members:
                  (target/m.name).write_bytes(z.extractfile(m).read())
          print('Verified installer source and CSS/JS assets')
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/wav-ui-care/apply_patch.py"
          node --check "$RUNNER_TEMP/wav-ui-care/ui.js"

      - name: Audit or repair member tap and site records
        env:
          WA_OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav-ui-care/apply_patch.py" --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"

      - name: Commit only scoped file changes
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import subprocess,pathlib
          def cmd(*a,check=True):
              return subprocess.run(['git',*a],text=True,capture_output=True,check=check)
          cmd('add','--','index.html')
          directory=pathlib.Path('wa-ui-care')
          if directory.is_dir():
              for p in sorted(directory.glob('ui-*')):
                  if p.suffix in ('.css','.js'):
                      cmd('add','--',str(p))
          changed=cmd('diff','--cached','--name-only').stdout.splitlines()
          safe=lambda x: x=='index.html' or (x.startswith('wa-ui-care/ui-') and x.endswith(('.js','.css')))
          if not all(safe(x) for x in changed):
              raise RuntimeError('Unexpected staged file: '+repr(changed))
          if not changed:
              print('No modifications; safe no-op')
              raise SystemExit(0)
          cmd('config','user.name','github-actions[bot]')
          cmd('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          cmd('diff','--cached','--check')
          cmd('commit','-m','Fix member back actions and refine WAV ARCHIVE mobile interaction')
          outcome=cmd('push','origin','HEAD:${{ github.ref_name }}',check=False)
          if outcome.returncode:
              print(outcome.stderr)
              raise RuntimeError('Push rejected; did not force push')
          print('Committed',len(changed),'scoped files')
          PYTHON
