name: WAV ARCHIVE - Mobile Touch and Archive Notes

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Check first, then apply the isolated UI fixes"
        type: choice
        required: true
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-ui-care-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ui-care:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout existing GitHub Pages site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

