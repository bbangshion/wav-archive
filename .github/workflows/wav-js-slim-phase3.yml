          import base64,gzip,hashlib,os,pathlib
          raw=gzip.decompress(base64.b64decode(os.environ['WAV_JS_SLIM_PAYLOAD']))
          expected='a8c269d910c5955b7caa259391350d462d34ab65aca70c09739ce138788c4018'
          actual=hashlib.sha256(raw).hexdigest()
          if actual!=expected:
              raise SystemExit('JS utility checksum mismatch; no repository files were modified')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'wa_js_slim_phase3.py'
          target.write_bytes(raw)
          print('Verified phase3 utility:',len(raw),'bytes')
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/wa_js_slim_phase3.py"

      - name: Audit, apply or roll back safe JS split
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wa_js_slim_phase3.py" \
            --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"

      - name: Stage and commit only JS slim files (apply or rollback)
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json,pathlib,subprocess
          def cmd(*args,check=True):
              return subprocess.run(['git',*args],check=check,text=True,capture_output=True)
          manifest=pathlib.Path('.github/wa-js-slim-phase3.json')
          cmd('add','--','index.html')
          if manifest.is_file():
              blocks=json.loads(manifest.read_text('utf-8'))['blocks']
              cmd('add','--',str(manifest))
              for asset in sorted(set(b['asset'] for b in blocks)):
                  if not pathlib.Path(asset).is_file():
                      raise RuntimeError('Phase3 asset missing: '+asset)
                  cmd('add','--',asset)
          elif cmd('ls-files','--error-unmatch','--',str(manifest),check=False).returncode==0:
              cmd('add','-u','--',str(manifest))
          changed=[s for s in cmd('diff','--cached','--name-only').stdout.splitlines() if s]
          allowed=lambda s: s in ('index.html','.github/wa-js-slim-phase3.json') or (s.startswith('wa-js-slim/wa-js-') and s.endswith('.js'))
          if not all(map(allowed,changed)):
              raise SystemExit('Unexpected staged files; refusing commit: '+repr(changed))
          if not changed:
              print('No source changes. Audit only or already applied/rolled back.')
              raise SystemExit(0)
          print('Staging only:',*changed,sep='\n - ')
          cmd('config','user.name','github-actions[bot]')
          cmd('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          cmd('commit','-m','Optimize WAV ARCHIVE JavaScript loading without changing core systems')
          result=cmd('push','origin','HEAD:${{ github.ref_name }}',check=False)
          if result.returncode:
              print(result.stdout,result.stderr)
              raise SystemExit('Git push rejected; no force push attempted')
          print('Pushed slim changes to current branch')
          PYTHON

      - name: Finished
        run: echo 'Check the Summary tab for exact JS/HTML size stats.'
