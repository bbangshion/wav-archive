# WAV ARCHIVE: conservative, reversible extraction of classic inline JS.
# Upload only this YAML to .github/workflows/ (no Python upload required).
# Audit the current index first. If the results are acceptable, choose apply.
# All 21 existing systems, IndexedDB data, CSS and images remain untouched.
# JS stays parser-blocking and in original document order (no async/defer).
name: WAV ARCHIVE - JS Slim

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit first; apply safe JS extraction; rollback just this patch'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-js-slim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  js-slim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest site (do not overwrite other components)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

