name: WAV ARCHIVE - UI Copy Polish 16 (Commit Fix)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit = check, apply = remove visible sentence-ending periods, rollback = undo'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-archive-ui-copy-polish-16-fix
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
