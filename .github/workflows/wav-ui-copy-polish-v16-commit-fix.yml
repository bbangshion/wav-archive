      - name: Commit patched HTML with clear diagnostics
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        env:
          WA_BRANCH: ${{ github.ref_name }}
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          echo "Operation: ${WA_OPERATION} | Target branch: ${WA_BRANCH}"
          echo "Modified HTML files before staging:"
          git status --short -- '*.html' '*.htm'
          # Commit ONLY previously tracked HTML: never stage API secrets, datasets, or assets.
          # An absent '*.htm' pathspec makes git add exit 128 on many repositories.
          # Enumerate tracked files first, then stage only those that really exist.
          mapfile -d '' -t html_files < <(git ls-files -z -- '*.html' '*.htm')
          if (( ${#html_files[@]} == 0 )); then
            echo '::error::No tracked HTML files found to commit.'
            exit 1
          fi
          git add -u -- "${html_files[@]}"
          if git diff --cached --quiet; then
            echo 'SUCCESS: No HTML changes to commit. Already applied or rolled back.'
            exit 0
          fi
          echo "Files included in commit:"
          git diff --cached --name-only
          if ! git diff --cached --check; then
            # Git whitespace checks can flag pre-existing line-ending/trailing spaces in
            # monolithic legacy HTML when our tiny script is inserted. The operation
            # is a display-only patch and Node validated the added JavaScript already.
            echo '::warning::Git whitespace warning detected; continuing without modifying legacy HTML formatting.'
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "WAV ARCHIVE: polish sentence punctuation (${WA_OPERATION})"
          echo "Pushing changes to ${WA_BRANCH}..."
          if git push origin "HEAD:refs/heads/${WA_BRANCH}"; then
            echo 'SUCCESS: UI Copy Polish has been committed and pushed.'
          else
            echo '::error::Commit was created, but GitHub rejected the push. The site was NOT updated.'
            echo '::error::Check repository Settings > Actions > General > Workflow permissions (read/write), and branch protection/rulesets.'
            echo '::error::If the remote branch changed meanwhile, rerun this workflow once.'
            exit 1
          fi
