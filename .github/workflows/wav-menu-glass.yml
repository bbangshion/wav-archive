name: WAV ARCHIVE - Minimal Glass Menu

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Audit / Apply / Rollback (CSS only)"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-minimal-glass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  menu-glass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current GitHub Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Audit or apply CSS-only glass menu
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 - <<'PYRUN'
          import base64,gzip,os,pathlib
          dst=pathlib.Path(os.environ['RUNNER_TEMP'])
          embedded={
              'install.py': '',
              'menu.css': '',
          }
          for name,blob in embedded.items():
              (dst/name).write_bytes(gzip.decompress(base64.b64decode(blob)))
          PYRUN
          python3 -m py_compile "$RUNNER_TEMP/install.py"
          python3 "$RUNNER_TEMP/install.py" \
            --root "$GITHUB_WORKSPACE" \
            --operation "$OPERATION" \
            --css-source "$RUNNER_TEMP/menu.css"
      - name: Commit only added menu stylesheet and menu header if changed
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html
          if [ -f wa-menu-glass/menu.css ] || git ls-files --error-unmatch wa-menu-glass/menu.css >/dev/null 2>&1; then
            git add -A -- wa-menu-glass/menu.css
          fi
          if git diff --cached --quiet; then
            echo "No changes: already applied or already rolled back"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine WAV ARCHIVE mobile menu with minimal translucent theme"
          git push origin "HEAD:${GITHUB_REF_NAME}"
