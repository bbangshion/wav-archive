      - name: Verify changes are whitespace-clean
        if: ${{ inputs.operation != 'audit' }}
        run: git diff --check

      - name: Upload audit/integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wav-perf-v4-report-${{ github.run_id }}
          path: wav-perf-v4-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit scoped changes to main
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html
          if [ -f objekt-collection/index.html ]; then git add -A -- objekt-collection/index.html; fi
          # The directory may be empty on rollback; git add -A handles staged removals.
          git add -A -- wav-perf-v4/ || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git diff --cached --stat
            git commit -m "perf: ${{ inputs.operation }} mobile stability v4 (preserve 21 systems)"
            git push origin HEAD:${{ github.ref_name }}
          fi
