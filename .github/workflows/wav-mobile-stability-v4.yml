name: WAV ARCHIVE - Mobile Stability V4

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Audit current files, apply cautious runtime patch, or rollback'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-mobile-stability-v4
  cancel-in-progress: false

jobs:
  safe-audit-and-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
