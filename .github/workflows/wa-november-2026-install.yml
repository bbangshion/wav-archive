name: WAV ARCHIVE - November 2026 Content Update

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Apply content update or rollback to recorded originals
        required: true
        type: choice
        options:
          - apply
          - rollback
        default: apply

permissions:
  contents: write

concurrency:
  group: wav-november-content-update-main
  cancel-in-progress: false

jobs:
  november-content:
    name: Safe calendar + live feed content update
