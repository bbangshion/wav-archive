      - name: Commit validated data changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ALREADY UP TO DATE / no changes to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "content: November 2026 official schedule update (${{ inputs.mode }})"
          git push origin HEAD:main
          echo "NOVEMBER 2026 CONTENT UPDATE: ${{ inputs.mode }} completed" >> "$GITHUB_STEP_SUMMARY"
          echo "Calendar / live feed and independent November page only; existing index.html and 21 systems preserved." >> "$GITHUB_STEP_SUMMARY"
