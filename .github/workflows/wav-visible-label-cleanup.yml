name: WAV ARCHIVE - Clean Visible Version Labels

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Audit first, then apply, or rollback"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-visible-label-cleanup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current site (preserve all existing systems)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore checksum-free self-contained installer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYRUN'
          import base64,gzip,os,pathlib
          code = ""
          raw = gzip.decompress(base64.b64decode(code))
          pathlib.Path(os.environ['RUNNER_TEMP'],'wav_visible_copy_cleanup.py').write_bytes(raw)
          PYRUN
          python3 -m py_compile "$RUNNER_TEMP/wav_visible_copy_cleanup.py"

      - name: Scan or clean visible developer version labels (offline only)
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav_visible_copy_cleanup.py" \
            --root "$GITHUB_WORKSPACE" \
            --operation "$OPERATION" \
            --changed-files "$RUNNER_TEMP/wav_visible_copy_changed.txt"

      - name: Commit only UI files changed by cleanup
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            if [ -n "$path" ]; then
              git add -A -- "$path"
            fi
          done < "$RUNNER_TEMP/wav_visible_copy_changed.txt"
          if git diff --cached --quiet; then
            echo "No updates: already installed, already reverted or no matching labels"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean public-facing developer version labels"
          git push origin "HEAD:${GITHUB_REF_NAME}"
