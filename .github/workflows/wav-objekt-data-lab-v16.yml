      - name: Validate module syntax and scope
        shell: bash
        run: |
          if [ "${{ inputs.operation }}" = apply ]; then
            for f in objekt-data-lab/*.mjs; do node --check "$f"; done
          fi
          git diff --check
          git diff --stat

      - name: Commit to main safely
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html objekt-data-lab
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: ${{ inputs.operation }} Objekt Data Lab 16"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
