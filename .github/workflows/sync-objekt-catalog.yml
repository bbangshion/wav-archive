name: Sync tripleS Objekt Catalog (Validated)

on:
  workflow_dispatch:
  schedule:
    # Every day around 12:23 KST (GitHub cron may run late).
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: wav-archive-objekt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout WAV ARCHIVE
        uses: actions/checkout@v4

      - name: Download and validate tripleS collection metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tempfile
          import urllib.request

          url = "https://objekt.top/api/v1/collections?artist=triples"
          target = pathlib.Path("objekt-collection/data/objekt-top.json")

          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "WAV-Archive-Fan-Collection/1.0 (GitHub Actions; metadata only)",
              },
              method="GET",
          )

          with urllib.request.urlopen(req, timeout=55) as response:
              if response.status != 200:
                  raise RuntimeError(f"API status: {response.status}")
              content = response.read(60 * 1024 * 1024 + 1)

          if len(content) > 60 * 1024 * 1024:
              raise ValueError("API response too large; refusing to replace snapshot")

          payload = json.loads(content.decode("utf-8"))

          if isinstance(payload, list):
              rows = payload
          elif isinstance(payload, dict):
              rows = payload.get("collections")
              if not isinstance(rows, list):
                  rows = payload.get("items")
          else:
              rows = None

          if not isinstance(rows, list) or not rows:
              raise ValueError("Unexpected or empty collection list; previous snapshot preserved")

          recognizable = sum(1 for r in rows if isinstance(r, dict) and
              r.get("member") and r.get("season") and r.get("collectionNo") and
              str(r.get("artist", "triples")).lower() == "triples")
          if recognizable / len(rows) < 0.98:
              raise ValueError("Unexpected collection schema; previous snapshot preserved")
          ids = [str(r["id"]) for r in rows if isinstance(r, dict) and r.get("id")]
          if len(ids) < len(rows) * 0.98 or len(ids) != len(set(ids)):
              raise ValueError("Duplicate or missing collection IDs; previous snapshot preserved")

          old_rows = []
          if target.is_file():
              old = json.loads(target.read_text(encoding="utf-8"))
              old_rows = old if isinstance(old, list) else old.get("collections", [])
              if not isinstance(old_rows, list):
                  old_rows = []
          # Allow some upstream removals, but never replace a complete snapshot with a partial feed.
          if old_rows and len(rows) < max(1000, int(len(old_rows) * 0.90)):
              raise ValueError(f"Unexpected data shrink {len(old_rows)} -> {len(rows)}; preserved")
          latest = max((r.get("createdAt", "") for r in rows if isinstance(r, dict)), default="")
          old_latest = max((r.get("createdAt", "") for r in old_rows if isinstance(r, dict)), default="")
          if old_latest and latest < old_latest:
              raise ValueError("Feed is older than stored snapshot; preserved")
          previous_ids = {str(r.get("id")) for r in old_rows if isinstance(r, dict)}
          added = sum(1 for r in rows if isinstance(r, dict) and str(r.get("id")) not in previous_ids)
          print(f"Objekt sync audit: {len(rows)} rows, +{added} new IDs, latest record {latest or 'unknown'}")

          target.parent.mkdir(parents=True, exist_ok=True)

          out = json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n"

          with tempfile.NamedTemporaryFile(
              "w",
              encoding="utf-8",
              dir=str(target.parent),
              delete=False
          ) as tmp:
              tmp.write(out)
              temp_path = tmp.name

          os.replace(temp_path, target)

          print(f"Validated {len(rows)} catalog rows; saved {target} ({len(out):,} characters).")

          PY

      - name: Commit validated snapshot (if changed)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add objekt-collection/data/objekt-top.json

          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "data: refresh tripleS Objekt catalog snapshot"
            git push
          fi
