        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64,gzip,hashlib,os,pathlib
          raw=gzip.decompress(base64.b64decode(os.environ['WA_CSS_SLIM_PAYLOAD']))
          actual=hashlib.sha256(raw).hexdigest()
          expected='f22fde9b444975bb5f285e1bbc1f9a1598602ac486624baa019c7ce3b9dc5c35'
          if actual!=expected:
              raise SystemExit('CSS extraction payload failed checksum validation')
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'wa_css_slim_phase2.py'
          target.write_bytes(raw)
          print('Verified extractor:',len(raw),'bytes')
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/wa_css_slim_phase2.py"

      - name: Audit, extract or restore CSS while keeping original selectors and order
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wa_css_slim_phase2.py" \
            --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"

      - name: Commit index, extraction manifest and content-addressed CSS only
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json,pathlib,subprocess
          def git(*args):
              subprocess.run(['git',*args],check=True)
          state=pathlib.Path('.github/wa-css-slim-phase2.json')
          git('add','--','index.html')
          if state.exists():
              items=json.loads(state.read_text('utf-8'))['blocks']
              git('add','--',str(state))
              for name in sorted(set(b['asset'] for b in items)):
                  if not pathlib.Path(name).is_file():
                      raise SystemExit('CSS asset missing at commit: '+name)
                  git('add','--',name)
          else:
              git('rm','--cached','--ignore-unmatch',str(state))
          PYTHON
          if git diff --cached --quiet; then
            echo 'No changes to commit; previous run already applied/rolled back'
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Extract large inline CSS while preserving site behavior'
          git push origin "HEAD:${GITHUB_REF_NAME}"
