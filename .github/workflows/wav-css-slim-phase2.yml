# WAV ARCHIVE: safe extraction of large inline CSS from current main index.html.
# Upload this YAML alone to .github/workflows and run audit -> apply.
# No app/UI version strings are added to the site.
name: WAV ARCHIVE - CSS Slim

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "audit first; apply CSS extraction; rollback restores only our CSS"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wa-css-slim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  css-slim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the current site without replacing site files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

