name: WAV ARCHIVE - App Install and Live Update
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit / apply / rollback'
        type: choice
        options:
          - audit
          - apply
          - rollback
        default: audit
        required: true
permissions:
  contents: write
concurrency:
  group: wav-pwa-installer-main
