        run: |
          python3 - <<'PYRESTORE'
          import os,base64,tarfile,io,pathlib
          p=pathlib.Path('/tmp/wa-pwa-pkg');p.mkdir(parents=True,exist_ok=True)
          raw=base64.b64decode(''.join(os.environ['WA_PAYLOAD'].split()),validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as tar:
              for m in tar.getmembers():
                  name=pathlib.PurePosixPath(m.name)
                  if name.is_absolute() or '..' in name.parts or not m.isfile():
                      raise RuntimeError('Unsafe package path')
                  dest=p.joinpath(*name.parts);dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(tar.extractfile(m).read())
          print('PWA installer restored:',len(raw),'bytes')
          PYRESTORE
      - name: Audit / apply / rollback (preserve existing core features)
        env:
          WA_OPERATION: ${{ inputs.operation }}
          WA_STAGE_LIST: /tmp/wav-pwa-changed-files.txt
        run: |
          python3 /tmp/wa-pwa-pkg/install.py "$WA_OPERATION" --repo "$GITHUB_WORKSPACE"
      - name: Check JavaScript and staged changes
        if: ${{ inputs.operation != 'audit' }}
        run: |
          if [ -f wav-pwa/install.js ]; then node --check wav-pwa/install.js; fi
          if [ -f wav-live-sw.js ]; then node --check wav-live-sw.js; fi
          git diff --check -- wav-pwa wav-live-sw.js manifest.webmanifest
      - name: Commit only PWA-owned files if there are changes
        if: ${{ inputs.operation != 'audit' }}
        env:
          WA_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCOMMIT'
          import os,subprocess,pathlib
          p=pathlib.Path('/tmp/wav-pwa-changed-files.txt')
          names=[x for x in p.read_text(encoding='utf-8').splitlines() if x.strip()] if p.exists() else []
          if not names:
              print('No PWA code changes to commit')
              raise SystemExit(0)
          subprocess.run(['git','add','--',*names],check=True)
          status=subprocess.run(['git','diff','--cached','--quiet'])
          if status.returncode==0:
              print('Already up to date — no commit needed')
              raise SystemExit(0)
          if status.returncode!=1:
              raise RuntimeError('git diff --cached failed')
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','WAV ARCHIVE: site app install and live content updates'],check=True)
          subprocess.run(['git','push','origin','HEAD:'+os.environ['WA_REF_NAME']],check=True)
          print('Committed PWA changes; check GitHub Pages deployment before testing.')
          PYCOMMIT
      - name: Summary
        if: always()
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          {
            echo '## WAV ARCHIVE — App install and live updates'
            echo "Mode: $WA_OPERATION"
            echo 'The old APK binary is not replaced. Site content is refreshed when opened online.'
            echo 'This workflow does not clear IndexedDB, Cache Storage or application user data.'
            echo 'Verify GitHub Pages deployment and test Chrome/Samsung Internet installation.'
          } >> "$GITHUB_STEP_SUMMARY"
