name: WAV ARCHIVE - MEMBER UNIVERSE phase 5 final install

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Install or safely roll back Phase 5 (default: install)'
        required: true
        default: install
        type: choice
        options:
          - install
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-member-universe-phase5-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Apply Phase 5 safely without editing original index.html
        shell: bash
        env:
          WA_MU5_MODE: ${{ inputs.mode }}
        run: |
          python - <<'PYINSTALL'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          import base64,hashlib,os,sys
          
          root=Path.cwd()
          mode=os.environ.get('WA_MU5_MODE','install')
          if mode not in ('install','rollback'):
              raise SystemExit('Invalid action mode')
          main=root/'index.html'
          shared=root/'members/universe/member-universe.js'
          if not main.is_file() or not shared.is_file():
              raise SystemExit('Existing main index or shared member script missing. No files changed.')
          original_main=hashlib.sha256(main.read_bytes()).hexdigest()
          original=shared.read_text(encoding='utf-8')
          loader="\n/* WA_MEMBER_UNIVERSE_PHASE5_LOADER — only independent member pages */\n(()=>{'use strict';\n const src=document.currentScript?.src;\n if(!src||document.querySelector('script[data-wa-member-phase5]'))return;\n const s=document.createElement('script');s.dataset.waMemberPhase5='1';\n s.src=new URL('member-universe-phase5.js?v=5',src).href;\n document.head.appendChild(s);\n})();\n"
          with ZipFile(BytesIO(base64.b64decode(''))) as z:
              entries={name:z.read(name) for name in z.namelist()}
          if len(entries)!=4:
              raise SystemExit('Invalid embedded payload')
          for name in entries:
              path=Path(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Blocked unsafe path')
              if not name.startswith(('members/universe/', 'tests/')) and name!='member-universe-sitemap.xml':
                  raise SystemExit('Blocked unexpected payload file')
          
          if mode == 'install':
              required=['members/universe/members.json','members/universe/member-universe-phase2.js','members/universe/member-universe-phase3.js',
                        'members/universe/member-universe-phase4.js','members/universe/member-universe-phase4-stories.json']
              for name in required:
                  if not (root/name).is_file():
                      raise SystemExit('Install Phase 1–4 first: missing '+name)
              for phase in (2,3,4):
                  if original.count('WA_MEMBER_UNIVERSE_PHASE'+str(phase)+'_LOADER')!=1:
                      raise SystemExit('Phase '+str(phase)+' loader missing/duplicated. No changes.')
              for n in range(1,25):
                  if not (root/f'members/s{n:02}/index.html').is_file():
                      raise SystemExit('Missing member page S'+str(n)+'. No changes.')
              if original.count('WA_MEMBER_UNIVERSE_PHASE5_LOADER')>1:
                  raise SystemExit('Duplicate Phase 5 loader. No changes.')
              if 'WA_MEMBER_UNIVERSE_PHASE5_LOADER' in original and loader not in original:
                  raise SystemExit('Existing Phase 5 loader is customized; refusing to overwrite.')
              for name,data in entries.items():
                  path=root/name
                  if path.exists() and path.read_bytes()!=data:
                      raise SystemExit('Existing customized Phase 5 file; refusing to overwrite: '+name)
              for name,data in entries.items():
                  path=root/name;path.parent.mkdir(parents=True,exist_ok=True)
                  if not path.exists():path.write_bytes(data)
              if loader not in original:
                  shared.write_text(original.rstrip()+loader,encoding='utf-8')
              print('PASS: Phase 5 assets installed; earlier features unmodified')
          else:
              # Rollback only our exact add-on. A customized file must never be destroyed.
              if 'WA_MEMBER_UNIVERSE_PHASE5_LOADER' in original and loader not in original:
                  raise SystemExit('Customized Phase 5 loader; refusing automatic rollback')
              for name,data in entries.items():
                  path=root/name
                  if path.exists() and path.read_bytes()!=data:
                      raise SystemExit('Customized Phase 5 file, refusing automatic rollback: '+name)
              for name in entries:
                  path=root/name
                  if path.exists():path.unlink()
              if loader in original:
                  shared.write_text(original.replace(loader,'').rstrip()+'\n',encoding='utf-8')
              print('PASS: Phase 5 files and loader removed; earlier phases unchanged')
          assert hashlib.sha256(main.read_bytes()).hexdigest()==original_main,'main index changed unexpectedly'
          PYINSTALL

      - name: Verify member pages, translations and script syntax
        if: ${{ inputs.mode == 'install' }}
        shell: bash
        run: |
          python tests/wa_member_universe_phase5_check.py
          node --check members/universe/member-universe-phase5.js
          node --check members/universe/member-universe.js
          git diff --exit-code -- index.html

      - name: Commit Phase 5 only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- members/universe/member-universe.js members/universe/member-universe-phase5.js members/universe/member-universe-phase5.css tests/wa_member_universe_phase5_check.py member-universe-sitemap.xml
          if git diff --cached --quiet; then
            echo "No Phase 5 changes; nothing to commit."
          else
            git commit -m "feat(member-universe): phase 5 isolated integration and provenance"
            git push origin HEAD:main
          fi
