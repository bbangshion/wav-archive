      - name: Audit, optimize or safely rollback only verified data searches
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav_runtime_opt.py" --root "$GITHUB_WORKSPACE" --operation "$OPERATION"

      - name: Review and commit only scoped files
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ -f objekt-collection/app.mjs ]; then git add -- objekt-collection/app.mjs; fi
          if [ -f signal-moments/signal.js ]; then git add -- signal-moments/signal.js; fi
          if [ -f .wav-performance/phase4.json ] || git ls-files --error-unmatch .wav-performance/phase4.json >/dev/null 2>&1; then
            git add -A -- .wav-performance/phase4.json
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No tracked source changed; skipping commit' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "perf: $OPERATION scoped Objekt and SIGNAL query optimization"
          git push origin "HEAD:$GITHUB_REF_NAME"
