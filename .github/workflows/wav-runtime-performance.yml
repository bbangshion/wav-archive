name: WAV ARCHIVE - Runtime Performance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Audit, apply or rollback (audit first)'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-performance-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current site without losing existing features
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

