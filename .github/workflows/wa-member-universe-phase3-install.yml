name: WAV ARCHIVE - MEMBER UNIVERSE phase 3 one-click install

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install phase 3 additively
        shell: bash
        run: |
          python - <<'PYINSTALL'
          import pathlib,base64,io,zipfile,hashlib,json,re
          root=pathlib.Path.cwd()
          shared=root/'members/universe/member-universe.js'
          phase2=root/'members/universe/member-universe-phase2.js'
          for p in [shared,phase2,root/'members/s01/index.html',root/'members/s24/index.html',root/'signal-moments/data.json']:
           if not p.is_file():raise SystemExit(f'Phase 3 requires existing file: {p}')
          existing=shared.read_text(encoding='utf-8')
          if 'dataset.waMember' not in existing or 'WA_MEMBER_UNIVERSE_PHASE2_LOADER' not in existing:
           raise SystemExit('Unexpected base member universe structure or missing Phase 2; nothing changed')
          if existing.count('WA_MEMBER_UNIVERSE_PHASE3_LOADER')>1:
           raise SystemExit('Multiple phase3 loaders in base; inspect before installing')
          data=json.loads((root/'signal-moments/data.json').read_text(encoding='utf-8'))
          if not isinstance(data.get('episodes'),list) or len(data['episodes'])<900:
           raise SystemExit('Original SIGNAL dataset has unexpected shape/count. Abort safely.')
