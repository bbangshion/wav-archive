      - name: Audit, update or restore only the editorial area
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav_editorial_patch.py" --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"
      - name: Commit only checked editorial changes
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- index.html .wav-editorial-backup
          if git diff --cached --quiet; then
            echo 'No changes to commit (already applied or not installed)'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update WAV ARCHIVE editorial records and story'
          git push
