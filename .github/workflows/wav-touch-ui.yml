name: WAV ARCHIVE - Clean Tap Interaction
run-name: Touch UI / ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect first, then apply CSS-only UI changes; rollback is reversible'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-touch-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  touch-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current site and all existing systems
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

