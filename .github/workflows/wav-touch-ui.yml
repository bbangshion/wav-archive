          import base64,gzip,hashlib,io,os,pathlib,tarfile
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'wa-touch-release'
          data=base64.b64decode((folder/'payload.base64').read_text())
          assert hashlib.sha256(data).hexdigest()==os.environ['WA_PAYLOAD_SHA256'], 'Package integrity check failed'
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(data)),mode='r:') as t:
              wanted={'installer.py','tap-clean.css'}
              assert {f.name for f in t.getmembers()}==wanted, 'Unexpected package files'
              for f in t:
                  assert f.isfile() and f.name in wanted, 'Invalid package entry'
                  (folder/f.name).write_bytes(t.extractfile(f).read())
          print('Verified CSS-only touch cleanup bundle')
          PYRUN

      - name: Audit, apply or rollback tap highlight and ripple cosmetics
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
          WA_TOUCH_STAGE_FILE: ${{ runner.temp }}/wa-touch-stage.txt
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wa-touch-release/installer.py" --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"

      - name: Commit only files owned by this patch
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          FILE_LIST="$RUNNER_TEMP/wa-touch-stage.txt"
          if [[ ! -s "$FILE_LIST" ]]; then
            echo 'No modified files: already in desired state'
            exit 0
          fi
          while IFS= read -r relative_path; do
            [[ -z "$relative_path" ]] && continue
            git add -A -- "$relative_path"
          done < "$FILE_LIST"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: remove distracting tap flash while preserving controls'
            git push
          fi
