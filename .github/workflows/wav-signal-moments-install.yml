name: WAV ARCHIVE - SIGNAL MOMENTS Explorer

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'install | refresh | rollback'
        required: true
        default: install
        type: choice
        options:
          - install
          - refresh
          - rollback
  schedule:
    - cron: '27 2 * * *'

permissions:
  contents: write

concurrency:
  group: wav-signal-moments-main
  cancel-in-progress: false

jobs:
  signal-moments:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Install or update SIGNAL Explorer
        shell: bash
        env:
          ACTION_MODE: ${{ github.event_name == 'schedule' && 'refresh' || inputs.operation }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import base64,io,os,re,zipfile,subprocess
          from pathlib import Path
          root=Path.cwd()
          page=root/'index.html'
          mode=os.getenv('ACTION_MODE','install').strip().lower()
          start='<!-- WAV SIGNAL MOMENTS MENU V1 -->'
          end='<!-- /WAV SIGNAL MOMENTS MENU V1 -->'
          menu='<!-- WAV SIGNAL MOMENTS MENU V1 -->\n<style id="wa-signal-moments-menu-style">\n#waGroupedMenu .wa-signal-moments-launch { display:flex;align-items:center;justify-content:space-between;width:100%;padding:17px 20px;margin:8px 0;border-radius:17px;border:1px solid rgba(150,94,255,.43);background:linear-gradient(100deg,#230d4a,#101128);color:#fff;text-align:left;font-weight:850;letter-spacing:.04em;cursor:pointer }\n#waGroupedMenu .wa-signal-moments-launch small{font-size:10px;color:#a6e8ff}\n#mobileMenu .wa-signal-moments-launch{display:block;width:100%;padding:13px;border:1px solid #734eb5;border-radius:12px;background:#201536;color:white;text-align:left;font-weight:800}\n</style>\n<script id="wa-signal-moments-menu-entry">\n(()=>{\'use strict\';\n if(window.__waSignalMomentsMenu)return;window.__waSignalMomentsMenu=true;\n const ensure=()=>{\n   const primary=[...document.querySelectorAll(\'#waGroupedMenu .wa-menu-group\')].find(g=>(g.querySelector(\'.wa-menu-label\')?.textContent??\'\').trim()===\'EXPLORE\')||document.querySelector(\'#waGroupedMenu .wa-menu-play\');\n   if(primary&&!primary.querySelector(\'[data-wa-signal-open]\')){\n     const b=document.createElement(\'button\');b.type=\'button\';b.className=\'wa-signal-moments-launch\';b.dataset.waSignalOpen=\'1\';\n     b.innerHTML=\'<span>✦ SIGNAL 탐색<br><small>2022–2026 · SIGNAL LIVE · 모먼트 검색</small></span><span aria-hidden="true">↗</span>\';\n     primary.appendChild(b);\n   }\n   const side=[...document.querySelectorAll(\'#mobileMenu .wa12-menu-group\')].find(x=>/EXPLORE|탐색/.test(x.querySelector(\'h3\')?.textContent??\'\'));\n   if(side&&!side.querySelector(\'[data-wa-signal-open]\')){\n     const b=document.createElement(\'button\');b.type=\'button\';b.className=\'wa-signal-moments-launch\';b.dataset.waSignalOpen=\'1\';b.textContent=\'✦ SIGNAL 탐색 · 2022–2026 ↗\';\n     (side.querySelector(\'.wa12-menu-links\')||side).appendChild(b);\n   }\n };\n if(document.readyState===\'loading\')document.addEventListener(\'DOMContentLoaded\',ensure,{once:true});else ensure();\n document.addEventListener(\'click\',ev=>{\n   if(ev.target.closest?.(\'[data-wa-signal-open]\')){ev.preventDefault();location.assign(new URL(\'./signal-moments/\',location.href).href);return;}\n   if(ev.target.closest?.(\'#waGroupedMenuOpen,#mobileMenuOpen,[aria-controls="waGroupedMenu"],[aria-controls="mobileMenu"],.wa-menu-toggle\'))setTimeout(ensure,50);\n },true);\n})();\n</script>\n<!-- /WAV SIGNAL MOMENTS MENU V1 -->'
          if mode not in ('install','refresh','rollback'):raise SystemExit('Unknown mode')
          if mode in ('install','rollback') and not page.is_file():raise SystemExit('Missing site index.html: safely aborting')
          if mode=='install':
              blob=''
              with zipfile.ZipFile(io.BytesIO(base64.b64decode(blob))) as archive:
                  for item in archive.infolist():
                      dest=root/item.filename
                      if not str(dest.resolve()).startswith(str(root.resolve())+os.sep):raise SystemExit('Unsafe ZIP path')
                      if dest.name=='data.json' and dest.exists():continue
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(archive.read(item))
              html=page.read_text(encoding='utf8')
              if start in html and end in html:html=html[:html.index(start)]+html[html.index(end)+len(end):]
              elif start in html or end in html:raise SystemExit('Partial marker: refusing unsafe edit')
              matches=list(re.finditer(r'</body\s*>',html,re.I))
              if not matches:raise SystemExit('Closing body tag missing')
              i=matches[-1].start()
              page.write_text(html[:i]+menu+'\n'+html[i:],encoding='utf8')
              print('SIGNAL MOMENTS installed. Existing member/Objekt/DNA data unchanged.')
          elif mode=='rollback':
              html=page.read_text(encoding='utf8')
              if start in html and end in html:
                  html=html[:html.index(start)]+html[html.index(end)+len(end):]
                  page.write_text(html,encoding='utf8')
              elif start in html or end in html:raise SystemExit('Partial marker: refusing unsafe rollback')
              for name in ('index.html','signal.js','signal.css','update_catalog.py'):
                  (root/'signal-moments'/name).unlink(missing_ok=True)
              print('Menu and module code removed. data.json retained.')
          elif mode=='refresh':
              update=root/'signal-moments'/'update_catalog.py'
              if not update.is_file():raise SystemExit('SIGNAL explorer not installed yet')
              subprocess.run(['python3',str(update)],check=True)
          PYCODE
      - name: Validate patch diff
        shell: bash
        run: |
          git diff --check
          git status --short
      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html signal-moments/
          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "signal: ${{ github.event_name == 'schedule' && 'refresh' || inputs.operation }} moments explorer"
            git push origin HEAD:${{ github.ref_name }}
          fi
