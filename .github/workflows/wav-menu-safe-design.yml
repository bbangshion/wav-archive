name: WAV ARCHIVE - Safe Menu Visual Polish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only audit, apply static CSS, or rollback"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wa-menu-safe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and run conservative menu patch
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          payloads={
              'install.py': '',
              'menu.css': '',
          }
          for name,encoded in payloads.items():
              (root/name).write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python3 "$RUNNER_TEMP/install.py" --root "$GITHUB_WORKSPACE" --operation "$OPERATION" --css-source "$RUNNER_TEMP/menu.css"
      - name: Commit only known menu patch files
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html
          if [ -f wa-menu-safe/menu.css ] || git ls-files --error-unmatch wa-menu-safe/menu.css >/dev/null 2>&1; then
            git add -A -- wa-menu-safe/menu.css
          fi
          if git diff --cached --quiet; then
            echo 'No changes to commit (idempotent operation)'
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply safe static-only WAV ARCHIVE menu presentation update"
          git push origin "HEAD:${{ github.ref_name }}"
