name: WAV ARCHIVE - SIGNAL DATA LAB 16

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "apply to add SIGNAL analytics / rollback to remove only this patch"
        required: true
        default: apply
        type: choice
        options:
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-signal-moments-main
  cancel-in-progress: false

jobs:
  signal-analytics:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply isolated analytics patch
        shell: bash
        env:
          WAV_SIGNAL_ANALYTICS_ACTION: ${{ inputs.operation }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os, re, zipfile, io, base64, shutil
          root=Path.cwd()
          page=root/'signal-moments/index.html'
          signal=root/'signal-moments/signal.js'
          dataset=root/'signal-moments/data.json'
          mode=os.environ.get('WAV_SIGNAL_ANALYTICS_ACTION','apply').lower().strip()
          if mode not in ('apply','rollback'):raise SystemExit('Invalid operation')
          if not page.is_file() or not dataset.is_file() or not signal.is_file():
              raise SystemExit('SIGNAL V2 not found (need signal-moments/index.html, signal.js, data.json)')
          section=root/'signal-moments'
          marker_a='<!-- WAV_SIGNAL_DATA_LAB_16_START -->'
          marker_b='<!-- WAV_SIGNAL_DATA_LAB_16_END -->'
          html=page.read_text(encoding='utf-8')
          had_patch=marker_a in html
          pat=re.compile(re.escape(marker_a)+r'.*?'+re.escape(marker_b)+r'\s*',re.DOTALL)
          html=pat.sub('',html)
          if mode=='rollback':
              for fn in ('analysis.js','analysis.css'):
                  dest=section/fn
                  backup=section/'.wav_signal_lab_backup'/fn
                  if backup.exists():shutil.copy2(backup,dest)
                  else:dest.unlink(missing_ok=True)
              page.write_text(html,encoding='utf-8')
              print('SIGNAL DATA LAB 16 rollback complete. SIGNAL V2 and data.json preserved.')
          else:
              with zipfile.ZipFile(io.BytesIO(base64.b64decode(''))) as z:
                  for fn in ('analysis.js','analysis.css'):
                      dest=section/fn
                      old=section/'.wav_signal_lab_backup'/fn
                      if dest.exists() and not old.exists() and not had_patch:
                          old.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copy2(dest,old)
                      dest.write_bytes(z.read(fn))
              if not (section/'analysis-notes.json').exists():
                  (section/'analysis-notes.json').write_text('{"schemaVersion":1,"videos":{},"events":[]}\n',encoding='utf-8')
              extra=(marker_a+'\n'
                 +'<link rel="stylesheet" href="./analysis.css?v=16.0.0">\n'
                 +'<script defer src="./analysis.js?v=16.0.0"></script>\n'
                 +marker_b+'\n')
              match=re.search(r'</body\s*>',html,re.IGNORECASE)
              if not match:raise SystemExit('SIGNAL V2 HTML body closing tag missing')
              html=html[:match.start()]+extra+html[match.start():]
              page.write_text(html,encoding='utf-8')
              print('SIGNAL DATA LAB 16 applied: existing SIGNAL video catalog NOT modified.')
          PYCODE
      - name: Validate changes
        run: |
          git diff --check
          git status --short
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signal-moments/index.html signal-moments/analysis.js signal-moments/analysis.css
          if [ -f signal-moments/analysis-notes.json ]; then git add signal-moments/analysis-notes.json; fi
          if [ -d signal-moments/.wav_signal_lab_backup ]; then git add signal-moments/.wav_signal_lab_backup; fi
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "signal: ${{ inputs.operation }} data lab 16"
            git push origin HEAD:${{ github.ref_name }}
          fi
