      - name: Measure, apply, or roll back only embedded images
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav_index_slim.py" --root "$GITHUB_WORKSPACE" --operation "$OPERATION"

      - name: Commit only index and extracted raster media
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- index.html
          if git ls-files --error-unmatch .github/wa-slim-images.json >/dev/null 2>&1 || [ -f .github/wa-slim-images.json ]; then
            git add -A -- .github/wa-slim-images.json
          fi
          if [ -d assets/wa-media ]; then
            git add -A -- assets/wa-media
          fi
          if git diff --cached --quiet; then
            echo 'Nothing changed. No commit necessary.'
            exit 0
          fi
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Extract inline raster images from main HTML without changing features'
          git push origin "HEAD:${GITHUB_REF_NAME}"
