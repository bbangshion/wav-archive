name: WAV ARCHIVE - Index Slim Phase 1

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Audit first; apply externalizes embedded images; rollback restores images"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-index-slim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index-slim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current WAV ARCHIVE without replacing any site components
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

