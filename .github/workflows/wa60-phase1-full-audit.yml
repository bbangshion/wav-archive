name: "WAV ARCHIVE 6.0 - Phase 1 full audit"
run-name: "WAV 6.0 full audit (${{ github.ref_name }})"
on:
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: "Also run Chromium mobile smoke test (slower)"
        type: boolean
        required: false
        default: false
      stop_on_critical:
        description: "Fail job when critical static problems are detected"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: wav60-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unpack embedded read-only auditor
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          pathlib.Path('/tmp/wa60_audit.py').write_bytes(gzip.decompress(base64.b64decode('')))
          pathlib.Path('/tmp/wa60_browser_smoke.py').write_bytes(gzip.decompress(base64.b64decode('')))
          PY
      - name: Run full static file integrity audit
        shell: bash
        run: |
          python /tmp/wa60_audit.py --root . --out "$RUNNER_TEMP/wa60-report" ${{ inputs.stop_on_critical && '--strict' || '' }}
      - name: Install Chromium for optional smoke check
        if: ${{ always() && inputs.browser_smoke }}
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Run optional mobile Chromium smoke check
        if: ${{ always() && inputs.browser_smoke }}
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/wa60-local-server.log" 2>&1 &
          sleep 3
          python /tmp/wa60_browser_smoke.py --url http://127.0.0.1:8765/ --out "$RUNNER_TEMP/wa60-report"
      - name: Upload report artifacts (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: WAV_ARCHIVE_6_0_PHASE1_AUDIT_${{ github.run_number }}
          path: ${{ runner.temp }}/wa60-report/
          if-no-files-found: warn
          retention-days: 30
      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/wa60-report/WAV_ARCHIVE_6_0_PHASE1_AUDIT.md" ]; then
            cat "$RUNNER_TEMP/wa60-report/WAV_ARCHIVE_6_0_PHASE1_AUDIT.md" >> "$GITHUB_STEP_SUMMARY"
          fi
