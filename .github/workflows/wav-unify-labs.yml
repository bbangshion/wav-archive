name: WAV ARCHIVE 15.5+ LAB - Unified Phase 11

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: 'Integrate all Phase 11 and 15.5+ tools into one LAB; or undo only this merge'
        required: true
        default: apply
        type: choice
        options:
          - apply
          - rollback

permissions:
  contents: write

jobs:
  unify-labs:
    runs-on: ubuntu-24.04
    concurrency:
      group: wav-archive-unify-labs-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout WAV ARCHIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Unify Phase 11 and 15.5+ LAB safely
        shell: bash
        env:
          WA_LAB_MERGE_ACTION: ${{ github.event.inputs.operation }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """WAV ARCHIVE 15.5+ UI consolidation. No changes to data or original Phase11 module.
          Called by an opt-in GitHub workflow. Runtime files embedded in workflow payload.
          """
          from __future__ import annotations
          from pathlib import Path
          import os, re, hashlib, base64, zlib, json
          
          ROOT=Path('index.html')
          LAB=Path('wav-plus-lab/index.html')
          ASSETS={
              'wav-plus-unified.js':'',
              'wav-plus-unified.css':'',
              'wav-plus-lab/unified.js':'',
              'wav-plus-lab/unified.css':''
          }
          
          MAIN_MARK='WA-PLUS-UNIFIED-MAIN-V1'
          NAV_MARK='WA-PLUS-UNIFIED-NAV-V1'
          SECTION_MARK='WA-PLUS-UNIFIED-SECTION-V1'
          LAB_ASSET_MARK='WA-PLUS-UNIFIED-LAB-ASSETS-V1'
          
          def decode_assets():
              return {name:zlib.decompress(base64.b64decode(value)) for name,value in ASSETS.items()}
          
          def tag(name,stage):return f'<!-- {name}-{stage} -->'
          
          def without_marker(html,name):
              begin=tag(name,'BEGIN');end=tag(name,'END')
              return re.sub(re.escape(begin)+r'.*?'+re.escape(end)+r'\n', '',html,count=1,flags=re.S)
          
          def add_before(html,snippet,target):
              matches=list(re.finditer(target,html,re.I))
              if not matches:raise RuntimeError('Target markup missing; no site files changed')
              p=matches[-1].start()
              return html[:p]+snippet+'\n'+html[p:]
          
          def main_apply(text):
              if tag(MAIN_MARK,'BEGIN') in text:return text
              if 'wa12-labs-integration-script' not in text and 'data-wa-labs-open' not in text:
                  raise RuntimeError('Phase 11 Labs integration not present: refusing to alter live menu')
              snippet='\n'.join((tag(MAIN_MARK,'BEGIN'),
                 '<link rel="stylesheet" href="./wav-plus-unified.css">',
                 '<script defer src="./wav-plus-unified.js"></script>',tag(MAIN_MARK,'END')))
              return add_before(text,snippet,r'</body\s*>')
          
          def lab_apply(text):
              if tag(NAV_MARK,'BEGIN') not in text:
                  nav=re.search(r'<nav\b[^>]*\bclass=["\'][^"\']*\btabs\b[^"\']*["\'][^>]*>.*?</nav\s*>',text,re.I|re.S)
                  if not nav or 'data-tab="binder"' not in nav.group():
                      raise RuntimeError('Original plus LAB nav changed; refusing unsafe injection')
                  snippet='\n'.join((tag(NAV_MARK,'BEGIN'),'<button type="button" data-tab="extended" aria-selected="false">추가 도구</button>',tag(NAV_MARK,'END')))
                  nav_text=nav.group();idx=re.search(r'</nav\s*>',nav_text,re.I).start()
                  newnav=nav_text[:idx]+snippet+'\n'+nav_text[idx:]
                  text=text[:nav.start()]+newnav+text[nav.end():]
              if tag(SECTION_MARK,'BEGIN') not in text:
                  tools='''<section id="extended" class="pane" hidden aria-label="추가 도구">
          <div class="heading"><div><small>05 · MORE WAV TOOLS</small><h2 id="waUnifiedTitle">기존 WAV LABS 도구</h2>
          <p id="waUnifiedSubtitle">기존 바인더·Gravity·유닛·콘서트 모드를 여기서 계속 사용할 수 있어.</p></div></div>
          <div class="panel" id="waUnifiedTools"><div class="wa-legacy-picker" role="group" aria-label="기존 도구 선택">
          <button type="button" data-wa-legacy="binder" aria-pressed="true">기존 Objekt Binder</button>
          <button type="button" data-wa-legacy="gravity" aria-pressed="false">Gravity LAB</button>
          <button type="button" data-wa-legacy="unit" aria-pressed="false">기존 Unit Studio</button>
          <button type="button" data-wa-legacy="offline" aria-pressed="false">콘서트 · 오프라인</button>
          </div><iframe id="waLegacyFrame" title="기존 WAV LABS 도구" src="about:blank" loading="lazy" referrerpolicy="same-origin"></iframe>
          <p id="waUnifiedNote">기존 저장 내역은 그대로 남아 있어. 두 바인더의 저장 공간은 현재 별도야.</p>
          </div></section>'''
                  snippet='\n'.join((tag(SECTION_MARK,'BEGIN'),tools,tag(SECTION_MARK,'END')))
                  text=add_before(text,snippet,r'<div\s+id=["\']toast["\']')
              if tag(LAB_ASSET_MARK,'BEGIN') not in text:
                  snippet='\n'.join((tag(LAB_ASSET_MARK,'BEGIN'),
                   '<link rel="stylesheet" href="./unified.css">',
                   '<script defer src="./unified.js"></script>',tag(LAB_ASSET_MARK,'END')))
                  text=add_before(text,snippet,r'</body\s*>')
              return text
          
          def install():
              mode=os.getenv('WA_LAB_MERGE_ACTION','apply').strip().lower()
              if mode not in ('apply','rollback'):raise SystemExit('Invalid merge operation')
              if not ROOT.is_file() or not LAB.is_file():
                  raise SystemExit('Cannot find index.html or wav-plus-lab/index.html; install Phase 11 and 15.5+ LAB first.')
              if not Path('wav-plus-launcher.js').is_file() or not Path('wav-labs/index.html').is_file():
                  raise SystemExit('Missing existing Phase11/Plus launcher; existing data not touched.')
              base=ROOT.read_text(encoding='utf-8')
              lab=LAB.read_text(encoding='utf-8')
              decoded=decode_assets()
          
              if mode=='apply':
                  # Preflight all targets so there are no half-applied files.
                  for name,value in decoded.items():
                      file=Path(name)
                      if file.is_file() and file.read_bytes()!=value:
                          raise SystemExit(f'Safety stop: {name} exists with different contents. Backup it first.')
                  next_main=main_apply(base)
                  next_lab=lab_apply(lab)
                  # Ensure existing app.mjs remains untouched, including its own binder storage keys.
                  for name,value in decoded.items():
                      file=Path(name);file.parent.mkdir(parents=True,exist_ok=True);file.write_bytes(value)
                  ROOT.write_text(next_main,encoding='utf-8')
                  LAB.write_text(next_lab,encoding='utf-8')
                  print('OK: one menu entry → 15.5+ LAB, original 4 Phase11 modules available in More Tools')
                  print('Existing Objekt/Gravity data, Phase11 code and Plus storage unchanged')
              else:
                  base=without_marker(base,MAIN_MARK)
                  lab=without_marker(lab,NAV_MARK)
                  lab=without_marker(lab,SECTION_MARK)
                  lab=without_marker(lab,LAB_ASSET_MARK)
                  ROOT.write_text(base,encoding='utf-8')
                  LAB.write_text(lab,encoding='utf-8')
                  for name,value in decoded.items():
                      file=Path(name)
                      if file.is_file() and file.read_bytes()==value:
                          file.unlink();print('Removed clean installer file:',name)
                      elif file.exists():print('Preserved user-modified file:',name)
                  print('Rollback complete; restored old Phase11 launcher and visible 15.5+ floating button.')
          
          if __name__=='__main__':install()
          PY
      - name: Verify syntax and changes
        shell: bash
        run: |
          if [ -f wav-plus-unified.js ]; then node --check wav-plus-unified.js; fi
          if [ -f wav-plus-lab/unified.js ]; then node --check wav-plus-lab/unified.js; fi
          git diff --check
          git status --short
      - name: Commit unified interface
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html wav-plus-lab/index.html wav-plus-unified.js wav-plus-unified.css wav-plus-lab/unified.js wav-plus-lab/unified.css
          if git diff --cached --quiet; then
            echo "Nothing changed; already applied or rolled back."
          else
            git commit -m "ui: ${{ github.event.inputs.operation }} single WAV 15.5+ LAB"
            git push origin HEAD:${{ github.ref_name }}
          fi
