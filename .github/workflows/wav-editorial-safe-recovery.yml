      - name: Audit or safely update the latest updates and build story
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wa_editorial_safe/safe_editorial.py" --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"
      - name: Commit scoped changes only
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- index.html
          if test -d .wav-editorial-safe-backup; then
            git add -A -- .wav-editorial-safe-backup
          elif test -n "$(git ls-files -- .wav-editorial-safe-backup)"; then
            git add -u -- .wav-editorial-safe-backup
          fi
          if git diff --cached --quiet; then
            echo 'NO CHANGES: safe patch did not modify the website'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh WAV ARCHIVE updates and creator story safely'
          git push
