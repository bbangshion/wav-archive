name: WAV ARCHIVE 15.5 Plus - Safe Core Installer

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Install or roll back only the WAV15.5+ module'
        required: true
        default: install
        type: choice
        options: [install, rollback]

permissions:
  contents: write

jobs:
  install-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout WAV ARCHIVE
        uses: actions/checkout@v4
      - name: Install isolated core without replacing existing components
        env:
          MODE: ${{ github.event.inputs.operation }}
        shell: bash
        run: |
          python3 - <<'PYBOOT'
          import os,base64,zlib,hashlib
          from pathlib import Path
          index=Path('index.html')
          if not index.is_file(): raise SystemExit('Root index.html not found')
          text=index.read_text(encoding='utf-8')
          start='<!-- WA155PLUS-CORE-START -->'
          end='<!-- WA155PLUS-CORE-END -->'
          payload={'wav-core.mjs': '', 'wav-core.css': '', 'wav-integration.mjs': '', 'wav-manifest.json': ''}
          if start in text and end in text:
            begin=text.index(start);finish=text.index(end,begin)+len(end)
            text=text[:begin]+text[finish:]
          elif start in text or end in text:
            raise SystemExit('Incomplete injection marker: manual check needed')
          if os.getenv('MODE','install')=='rollback':
            index.write_text(text,encoding='utf-8')
            # Do NOT delete files if user changed them after the installer created them.
            for name,b64 in payload.items():
              path=Path(name)
              data=zlib.decompress(base64.b64decode(b64))
              if path.exists() and path.read_bytes()==data: path.unlink()
            print('Removed only matching module source files; original index restored')
          else:
            if 'memberGrid' not in text:
              raise SystemExit('Unexpected index: memberGrid not found. No changes made.')
            for name,b64 in payload.items():
              data=zlib.decompress(base64.b64decode(b64))
              target=Path(name)
              if target.exists() and target.read_bytes()!=data:
                raise SystemExit(f'Existing {name} has custom contents. Rename/back up before installing.')
            for name,b64 in payload.items():
              Path(name).write_bytes(zlib.decompress(base64.b64decode(b64)))
            snippet=(start+'\n'+
              '<link rel="stylesheet" href="./wav-core.css">\n'+
              '<script>window.WAV_CORE_SETTINGS = window.WAV_CORE_SETTINGS || {chainId:2741, rpcUrl:"https://api.mainnet.abs.xyz", members:[]};</script>\n'+
              '<script type="module" src="./wav-integration.mjs"></script>\n'+
              end+'\n')
            if '</body>' not in text:raise SystemExit('Missing </body>')
            text=text.replace('</body>',snippet+'</body>',1)
            index.write_text(text,encoding='utf-8')
            print('Installed safe optional module; connect verified data separately')
          PYBOOT
      - name: Verify files and diff
        shell: bash
        run: |
          if [ -f wav-core.mjs ]; then node --check wav-core.mjs; fi
          if [ -f wav-integration.mjs ]; then node --check wav-integration.mjs; fi
          git diff --check
          git status --short
      - name: Commit to GitHub Pages source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html wav-core.mjs wav-core.css wav-integration.mjs wav-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: ${{ github.event.inputs.operation }} WAV 15.5+ optional core"
            git push origin HEAD:${{ github.ref_name }}
          fi
