name: WAV ARCHIVE - Emergency Menu Recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "rollback = restore original site / repair = keep redesign with lightweight script / audit = inspect"
        required: true
        default: rollback
        type: choice
        options:
          - rollback
          - repair
          - audit

permissions:
  contents: write

concurrency:
  group: wav-archive-menu-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    name: Emergency safe menu recovery
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

