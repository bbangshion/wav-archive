          CW8k+AU4c/k53HxntLn6rfDm/XV/3V/31/11f91f99f9dX/dX/fX/XV/3V/31/11f91f99f99c+5/hdssKdN
          AHgAAA=='''.replace('\n','').replace(' ','')
          payload=base64.b64decode(encoded)
          if hashlib.sha256(payload).hexdigest()!=os.environ['EXPECT_SHA256']:
              raise SystemExit('Embedded repair package checksum mismatch')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'wav-menu-safe-recovery'
          out.mkdir(parents=True,exist_ok=True)
          allowed={'repair.py','legacy_install.py','old-menu.js','pack/menu.js'}
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(payload)), mode='r:') as tar:
              for entry in tar.getmembers():
                  if entry.name not in allowed or not entry.isfile():
                      raise SystemExit('Unexpected package entry: '+entry.name)
                  dest=out/entry.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(tar.extractfile(entry).read())
          print('Verified recovery files unpacked')
          PY_UNPACK

      - name: Perform safe rollback, repair or audit
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wav-menu-safe-recovery/repair.py" "$OPERATION" \
            --root "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/wav-menu-recovery-manifest.txt"

      - name: Commit only owned patch files
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/wav-menu-recovery-manifest.txt" ]; then
            echo 'Nothing to commit'
            exit 0
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            git add -A -- "$path"
          done < "$RUNNER_TEMP/wav-menu-recovery-manifest.txt"
          if git diff --cached --quiet; then
            echo 'Already up to date'
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover WAV ARCHIVE mobile menu responsiveness"
          git push
