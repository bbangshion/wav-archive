      - name: Verify member stories
        shell: bash
        run: |
          python tests/wa_member_universe_phase4_check.py
          node --check members/universe/member-universe-phase4.js
          git diff --exit-code -- index.html
      - name: Commit only Phase 4 add-ons
        shell: bash
