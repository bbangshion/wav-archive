      - name: Audit or install official logo
        env:
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/wav_brand_icon_tools/install_icon.py" "$OPERATION" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/wav_brand_icon_tools/icons"
      - name: Commit only icon-related changes
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          git add -A
          python3 - <<'PY'
          import subprocess,sys
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'index.html','manifest.webmanifest','.github/wav-archive-app-icon-state.json'}
          unexpected=[p for p in names if p not in allowed and not p.startswith('icons/wav-archive-')]
          if unexpected:
              print('Refusing commit of unrelated files:', unexpected, file=sys.stderr)
              sys.exit(1)
          print('Changed files:',names or '(none)')
          PY
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Set WAV ARCHIVE app launcher icon"
          git push origin "HEAD:${{ github.ref_name }}"
