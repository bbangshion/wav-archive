name: WAV ARCHIVE - Member Card Touch Recovery
run-name: Member Card Touch Recovery / ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Audit first, then apply. Rollback only this member-card patch"
        required: true
        type: choice
        default: audit
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write
concurrency:
  group: wav-member-card-hitfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  member-card-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out live WAV ARCHIVE without replacing project files
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

