          export PACKAGE_SHA256=aeb4be760cdf12eff0d9189d82fafa777b966fe237e665fe187eaf8c0f735801
          python3 - <<'PY'
          import base64,gzip,hashlib,io,os,pathlib,tarfile
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'member-card-hitfix'
          data=base64.b64decode((d/'payload.base64').read_text())
          assert hashlib.sha256(data).hexdigest()==os.environ['PACKAGE_SHA256'], 'Patch integrity failure'
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(data)),mode='r:') as archive:
              allowed={'installer.py','member-hitfix.css','member-hitfix.js'}
              assert {m.name for m in archive.getmembers()}==allowed
              for m in archive:
                  assert m.isfile() and m.name in allowed
                  (d/m.name).write_bytes(archive.extractfile(m).read())
          print('Verified small member-card repair payload')
          PY

      - name: Audit, apply, or rollback only member-card hit-testing
        shell: bash
        env:
          WA_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/member-card-hitfix/installer.py" --root "$GITHUB_WORKSPACE" --operation "$WA_OPERATION"

      - name: Commit only changed index.html when needed
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- index.html
          git add -- index.html
          if git diff --cached --quiet; then
            echo 'Nothing changed. No commit needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: restore member card back button hit targets'
            git push
          fi
