name: WAV ARCHIVE - SIGNAL V2 Full Library & Player

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'upgrade: UI and embed | refresh: download official video records | rollback: restore previous UI'
        required: true
        default: upgrade
        type: choice
        options:
          - upgrade
          - refresh
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-signal-moments-main
  cancel-in-progress: false

jobs:
  signal-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Install UI or sync official catalogue
        shell: bash
        env:
          WAV_SIGNAL_ACTION: ${{ inputs.operation }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'PYCODE'
          import os,io,base64,re,zipfile,shutil,subprocess
          from pathlib import Path
          root=Path.cwd()
          section=root/'signal-moments'
          mode=os.environ.get('WAV_SIGNAL_ACTION','upgrade').strip()
          if mode not in ('upgrade','refresh','rollback'):raise SystemExit('Unknown operation')
          if not (root/'index.html').is_file():raise SystemExit('Missing homepage index.html')
          backup=section/'.wav_signal_v1_backup'
          files=('index.html','signal.css','signal.js','update_catalog.py')
          if mode=='upgrade':
              section.mkdir(parents=True,exist_ok=True)
              if not backup.exists():
                  backup.mkdir(parents=True)
                  for fn in files:
                      orig=section/fn
                      if orig.is_file():shutil.copy2(orig,backup/fn)
                  (backup/'.initialized').write_text('v1 snapshot, do not delete',encoding='utf8')
              encoded=''
              with zipfile.ZipFile(io.BytesIO(base64.b64decode(encoded))) as payload:
                  for info in payload.infolist():
                      relative=Path(info.filename)
                      if len(relative.parts)!=2 or relative.parts[0]!='signal-moments' or relative.name not in files:raise SystemExit('Unexpected archive path')
                      target=root/relative
                      target.write_bytes(payload.read(info))
              if not (section/'data.json').exists():raise SystemExit('SIGNAL data.json missing! Install V1 first; this upgrade never fabricates historical records.')
              print('SIGNAL V2 installed (data.json preserved, existing menu unchanged).')
              if os.environ.get('YOUTUBE_API_KEY'):
                  print('API key present: syncing official full history.')
                  subprocess.run(['python3',str(section/'update_catalog.py')],check=True)
          elif mode=='refresh':
              if not (section/'update_catalog.py').is_file():raise SystemExit('SIGNAL updater missing')
              subprocess.run(['python3',str(section/'update_catalog.py')],check=True)
          elif mode=='rollback':
              if not (backup/'.initialized').exists():raise SystemExit('No V1 backup found; refusing rollback')
              for fn in files:
                  source=backup/fn
                  if source.is_file():shutil.copy2(source,section/fn)
                  else:(section/fn).unlink(missing_ok=True)
              print('SIGNAL V1 UI restored. data.json and verified episodes preserved.')
          PYCODE
      - name: Check file changes
        shell: bash
        run: |
          git diff --check
          git status --short
      - name: Commit changed files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A signal-moments/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "signal: ${{ inputs.operation }} full-history explorer V2"
            git push origin HEAD:${{ github.ref_name }}
          fi
