name: WAV ARCHIVE - Visual Renewal Phase 2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Apply, verify or rollback only HOME/navigation Phase 2 styling'
        type: choice
        required: true
        default: apply
        options:
          - apply
          - verify
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-visual-renewal-p2
  cancel-in-progress: false

jobs:
  home-navigation-renewal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository main (preserves existing 21 systems)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "main" || { echo 'SAFETY STOP: Run workflow on main'; exit 2; }
      - name: Safely apply, verify, or rollback Phase 2 CSS
        shell: bash
        env:
          WA_VISUAL_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 - "$WA_VISUAL_MODE" <<'PY'
          #!/usr/bin/env python3
          """WAV ARCHIVE visual renewal P2: add/removal of one stylesheet link and file.

          Always operates on the repository currently checked out by GitHub Actions.
          Never copies index.html from a historical ZIP. No JavaScript or DOM mutations.
          """
          from pathlib import Path
          import base64
          import hashlib
          import os
          import sys

          HERE = Path(__file__).resolve().parent
          INDEX = Path('index.html')
          CSS_PATH = Path('wa-visual/v2-home-nav.css')
          START = '<!-- WA-VISUAL-RENEWAL-P2:BEGIN -->'
          END = '<!-- WA-VISUAL-RENEWAL-P2:END -->'
          LINK = (START + '\n'
                  + '<link id="wa-visual-renewal-p2" rel="stylesheet" '
                  + 'href="./wa-visual/v2-home-nav.css?v=20261107-p2">\n'
                  + END + '\n')
          CSS = base64.b64decode('')


          def die(message):
              raise RuntimeError('SAFETY STOP: ' + message)


          def text(path):
              return path.read_text(encoding='utf-8')


          def write(path, contents):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(contents, encoding='utf-8', newline='')


          def checks(html):
              if not html or 'WAV ARCHIVE' not in html or 'memberGrid' not in html:
                  die('index.html does not resemble WAV ARCHIVE; nothing changed')
              if html.lower().count('</head>') != 1:
                  die('unexpected </head> count; nothing changed')
              if not any(key in html for key in ('id="xHome"', 'id="wa50Home"',
                                                 'wa59-landing', 'id="wa6Home"')):
                  die('known HOME layout not found; nothing changed')
              if html.count(START) != html.count(END) or html.count(START) > 1:
                  die('Phase 2 HTML markers are inconsistent; nothing changed')
              if START in html and LINK not in html:
                  die('Phase 2 HTML was manually modified; nothing changed')
              if START not in html and ('wa-visual-renewal-p2' in html or
                                        'wa-visual/v2-home-nav.css' in html):
                  die('possible existing Phase 2 link without markers')
              if CSS_PATH.exists() and CSS_PATH.read_bytes() != CSS:
                  die('Phase 2 CSS differs from source; not overwriting user edits')


          def apply():
              if not INDEX.is_file(): die('index.html not found')
              html = text(INDEX)
              checks(html)
              if START not in html:
                  write(INDEX, html.replace('</head>', LINK + '</head>', 1))
              if not CSS_PATH.exists():
                  CSS_PATH.parent.mkdir(parents=True, exist_ok=True)
                  CSS_PATH.write_bytes(CSS)
              print('VISUAL P2: APPLIED' + (' (already current)' if START in html else ' (new stylesheet)'))
              if 'wa-visual-renewal-p1' not in html:
                  print('NOTICE: Phase 1 stylesheet link not found; P2 has standalone fallback tokens')
              print('Home / header / drawer / dock styling only. No JS, HTML blocks or data replaced.')


          def verify():
              if not INDEX.is_file(): die('index.html not found')
              html = text(INDEX)
              checks(html)
              if LINK not in html or not CSS_PATH.is_file(): die('Phase 2 not installed')
              print('VISUAL P2: VERIFIED | stylesheet sha256=' + hashlib.sha256(CSS).hexdigest()[:16])
              print('Static install verification only; mobile render and functionality need device QA.')


          def rollback():
              if not INDEX.is_file(): die('index.html not found')
              html = text(INDEX)
              checks(html)
              if START not in html and CSS_PATH.exists():
                  die('Stylesheet remains without marker; manual review needed')
              if START in html:
                  write(INDEX, html.replace(LINK, '', 1))
              if CSS_PATH.exists():
                  CSS_PATH.unlink()
              if CSS_PATH.parent.exists() and not any(CSS_PATH.parent.iterdir()):
                  CSS_PATH.parent.rmdir()
              print('VISUAL P2: ROLLED BACK' + (' (already absent)' if START not in html else ''))
              print('Phase 1 styling and every other site file are untouched.')


          if __name__ == '__main__':
              try:
                  {'apply': apply, 'verify': verify, 'rollback': rollback}[sys.argv[1]]()
              except (KeyError, IndexError, OSError, RuntimeError) as exc:
                  print(exc, file=sys.stderr)
                  sys.exit(2)
          PY
      - name: Allow only index link and new stylesheet file to change
        if: inputs.mode != 'verify'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from subprocess import run
          out=run(['git','status','--porcelain','--untracked-files=all'],check=True,text=True,capture_output=True).stdout
          changed={row[3:] for row in out.splitlines() if len(row) > 3}
          allowed={'index.html','wa-visual/v2-home-nav.css'}
          unexpected=changed - allowed
          if unexpected:
              raise SystemExit('SAFETY STOP: unexpected changed paths '+repr(sorted(unexpected)))
          print('Approved changed paths:', sorted(changed))
          PY
          git add -A -- index.html wa-visual/v2-home-nav.css
          if git diff --cached --quiet; then
            echo 'VISUAL P2: no changes to commit'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style: premium HOME and navigation visual renewal phase 2'
          git push origin HEAD:main
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## WAV ARCHIVE — Visual Renewal Phase 2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode: **${{ inputs.mode }}**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Scoped to HOME, header, mobile drawer, bottom dock, footer and nav tap feedback' >> "$GITHUB_STEP_SUMMARY"
          echo '- No JavaScript, menu routing, member cards, 3D, PWA or content data replaced' >> "$GITHUB_STEP_SUMMARY"
          echo '- Verify GitHub Pages deployment then test Samsung Internet navigation and page refresh' >> "$GITHUB_STEP_SUMMARY"
