name: WAV ARCHIVE 15.5+ - NEW FEATURES

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Install or roll back only the optional 15.5+ feature UI'
        required: true
        default: install
        type: choice
        options: [install, rollback]

permissions:
  contents: write

jobs:
  deploy-new-features:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install safe on-demand feature UI
        shell: bash
        env:
          OPERATION: ${{ github.event.inputs.operation }}
        run: |
          python3 - <<'WAV_NEW_FEATURES_PY'
          import base64,zlib,os,re
          from pathlib import Path

          root=Path('index.html')
          if not root.is_file():raise SystemExit('ERROR: index.html not found at repository root')
          if not Path('wav-core.mjs').is_file():raise SystemExit('ERROR: Run 15.5+ Safe Core Installer first (wav-core.mjs missing)')
          original=root.read_text(encoding='utf-8')
          start='<!-- WAV-PLUS-NEW-FEATURES-BEGIN -->'
          end='<!-- WAV-PLUS-NEW-FEATURES-END -->'
          if original.count(start)!=original.count(end):raise SystemExit('ERROR: Broken patch markers. No changes made.')
          assets={'wav-plus-launcher.css': '', 'wav-plus-launcher.js': '', 'wav-plus-lab/index.html': '', 'wav-plus-lab/style.css': '', 'wav-plus-lab/app.mjs': ''}
          mode=os.environ.get('OPERATION','install')
          if mode not in ('install','rollback'):raise SystemExit('Invalid operation')
          html=original
          if start in html:
              a=html.index(start);b=html.index(end,a)+len(end)
              html=html[:a]+html[b:]
          if mode=='rollback':
              root.write_text(html,encoding='utf-8')
              for path,b64 in assets.items():
                  p=Path(path);content=zlib.decompress(base64.b64decode(b64))
                  if p.is_file() and p.read_bytes()==content:p.unlink()
              print('Rollback complete: only new feature launcher and exact matching generated files removed.')
          else:
              if 'memberGrid' not in html:raise SystemExit('Unexpected site: missing memberGrid. Refusing modification.')
              if not re.search(r'</body\s*>',html,re.I):raise SystemExit('Cannot find closing </body>. Refusing modification.')
              # Preflight all files before writing any of them.
              decoded={name:zlib.decompress(base64.b64decode(data)) for name,data in assets.items()}
              for name,data in decoded.items():
                  path=Path(name)
                  if path.is_file() and path.read_bytes()!=data:
                      raise SystemExit(f'ERROR: {name} has custom content. Refusing overwrite.')
              snippet=(start+'\n'+
                 '<link rel="stylesheet" href="./wav-plus-launcher.css">\n'+
                 '<script defer src="./wav-plus-launcher.js"></script>\n'+
                 end+'\n')
              html=re.sub(r'</body\s*>',lambda m:snippet+m.group(0),html,count=1,flags=re.I)
              for name,data in decoded.items():
                  p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
              root.write_text(html,encoding='utf-8')
              print('Installed new features: launcher + MY OBJEKT + UNIT STUDIO + GRAVITY + ONCHAIN status')
          WAV_NEW_FEATURES_PY
      - name: Verify syntax, integrity and changes
        run: |
          if [ -f wav-plus-launcher.js ]; then node --check wav-plus-launcher.js; fi
          if [ -f wav-plus-lab/app.mjs ]; then node --check wav-plus-lab/app.mjs; fi
          git diff --check
          git status --short
      - name: Commit to GitHub Pages branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html
          for p in wav-plus-launcher.css wav-plus-launcher.js wav-plus-lab; do
            if [ -e "$p" ] || [ -n "$(git ls-files -- "$p")" ]; then
              git add -A -- "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "feat: ${{ github.event.inputs.operation }} WAV 15.5+ visible tools"
            git push origin HEAD:${{ github.ref_name }}
          fi
