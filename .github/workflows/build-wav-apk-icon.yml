      - name: Build signed debug APK (personal installation)
        shell: bash
        run: gradle -p android-app --no-daemon :app:assembleDebug

      - name: Prepare installable APK
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk out/WAV-ARCHIVE-ICON.apk
          ls -lh out/WAV-ARCHIVE-ICON.apk

      - name: Downloadable APK
        uses: actions/upload-artifact@v7
        with:
          path: out/WAV-ARCHIVE-ICON.apk
          archive: false
          if-no-files-found: error
