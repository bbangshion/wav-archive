name: WAV ARCHIVE - Menu Refresh

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "audit = inspect only / apply = install / rollback = revert"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-archive-menu-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Inspect and update visible branding
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout site (all existing data preserved)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

