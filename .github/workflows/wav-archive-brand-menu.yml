          payload=base64.b64decode(encoded)
          if hashlib.sha256(payload).hexdigest()!=os.environ['EXPECT_SHA256']:
              raise SystemExit('Embedded installer checksum mismatch')
          dest=pathlib.Path(os.environ['RUNNER_TEMP'])/'wa-menu-refresh-installer'
          dest.mkdir(parents=True,exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(payload)),mode='r:') as tar:
              allowed={'install.py','pack/wav-brand-refresh/menu.js','pack/wav-brand-refresh/menu.css'}
              for member in tar.getmembers():
                  if member.name not in allowed or not member.isfile():
                      raise SystemExit('Unexpected tar archive member')
                  path=dest/member.name
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(tar.extractfile(member).read())
          print('Installer verified and extracted to runner temporary directory')
          PY_RESTORE

      - name: Audit, apply, or rollback branding-only changes
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/wa-menu-refresh-installer/install.py" "$OPERATION" \
            --root "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/wa-menu-refresh-changed.txt" \
            --report "$RUNNER_TEMP/wa-menu-refresh-audit.json"

      - name: Stage only files actually managed by this patch
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/wa-menu-refresh-changed.txt" ]; then
            echo 'No changes to commit'
            exit 0
          fi
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            git add -A -- "$entry"
          done < "$RUNNER_TEMP/wa-menu-refresh-changed.txt"
          if git diff --cached --quiet; then
            echo 'Already up to date'
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine WAV ARCHIVE menu presentation and remove UI version badges"
          git push

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wav-menu-refresh-audit
          path: ${{ runner.temp }}/wa-menu-refresh-audit.json
          if-no-files-found: ignore
          retention-days: 14
