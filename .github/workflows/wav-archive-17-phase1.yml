name: WAV ARCHIVE 17 - Phase 1 Connected Universe

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "audit = inspect only; apply = install; rollback = revert v17 only"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - apply
          - rollback

permissions:
  contents: write

concurrency:
  group: wav-archive-v17-phase1
  cancel-in-progress: false

jobs:
  v17-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current website - preserve all core systems
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Inspect repository and run scoped v17 installer
