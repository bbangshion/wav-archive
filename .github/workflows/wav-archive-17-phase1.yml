        run: |
          python - <<'PY'
          import base64, io, os, pathlib, subprocess, sys, tarfile, tempfile
          archive=base64.b64decode(os.environ['WA17_BUNDLE_BASE64'].replace(' ',''))
          temp=pathlib.Path(tempfile.mkdtemp(prefix='wav17_'))
          whitelist={'install.py','pack/wav-connect-17/connect.js','pack/wav-connect-17/connect.css'}
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as src:
              assert set(src.getnames())==whitelist, 'Bundle contents mismatch'
              for f in src.getmembers():
                  if not f.isfile() or f.name not in whitelist:
                      raise RuntimeError('Invalid bundle entry: '+f.name)
                  dest=temp/f.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(src.extractfile(f).read())
          subprocess.run([sys.executable,str(temp/'install.py'),os.environ['WA17_OP']],check=True)
          PY

      - name: Check generated code and pending changes
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        run: |
          if [ -f wav-connect-17/connect.js ]; then
            node --check wav-connect-17/connect.js
          fi
          git diff --check
          git status --short

      - name: Commit only Phase 1 changes if present
        if: ${{ inputs.operation != 'audit' }}
        shell: bash
        env:
          WA17_OP: ${{ inputs.operation }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html wav-connect-17
          if git diff --cached --quiet; then
            echo 'No v17 changes to commit (already in requested state)'
          else
            git commit -m "WAV ARCHIVE 17 phase1 $WA17_OP: connected data foundation"
            git push
          fi

      - name: Upload repository audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wav17-phase1-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/wav17-phase1-audit.json
          if-no-files-found: warn
          retention-days: 30
